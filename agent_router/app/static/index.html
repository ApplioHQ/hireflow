<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/logo.svg?v=2">
<link rel="apple-touch-icon" href="/icon-192.png?v=2">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/logo.svg" alt="" width="24" height="24">
      <span>Agents</span>
    </div>
    <button class="new-task" id="new-chat" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      New chat
    </button>
    <input class="search" id="search" type="search" placeholder="Search chats" aria-label="Search chats">
    <nav class="task-list" id="projects" aria-label="Projects and chats"></nav>
    <button type="button" class="add-project" id="add-project">+ Add project folder</button>
    <div class="side-foot">
      <div class="side-links">
        <button type="button" data-panel="doctor"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Agents</button>
        <button type="button" data-panel="models"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m6.36-.64l-2.12 2.12M21 12h-3M18.36 18.36l-2.12-2.12M12 21v-3M7.76 18.36l2.12-2.12M3 12h3M5.64 5.64l2.12 2.12"/></svg>Models</button>
        <button type="button" data-panel="memory"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/><path d="M10 21h4"/></svg>Memory</button>
        <button type="button" data-panel="diff"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Changes</button>
        <button type="button" id="term-toggle" title="Open a terminal in this project (Ctrl+`)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>Terminal</button>
        <button type="button" id="preview-toggle" title="Live preview of the project"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/></svg>Preview</button>
      </div>
      <button type="button" class="install" id="install" hidden>Install app</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="head" id="head"></header>
    <section class="messages" id="messages" aria-live="polite"></section>
    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-box" id="composer-box">
        <div class="chips" id="chips" hidden></div>
        <textarea id="input" rows="1" placeholder="Ask anything or describe a change..."></textarea>
        <div class="drop-hint">Drop files to attach</div>
        <div class="composer-row">
          <button type="button" class="icon-btn attach-btn" id="attach-btn" aria-label="Attach files" title="Attach files (or drag, or paste a screenshot)">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.5 3.5 0 0 1 5 5l-8.6 8.6a2 2 0 0 1-2.8-2.8l7.9-7.9" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input type="file" id="file-input" multiple hidden>
          <select class="project-pick" id="project-pick" aria-label="Project"></select>
          <div class="agent-pick" id="agent-pick" role="radiogroup" aria-label="Who handles this"></div>
          <span class="composer-note" id="composer-note"></span>
          <button type="submit" class="send" id="send-btn" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </form>
    <div class="term-drawer" id="term-drawer" hidden>
      <div class="term-head">
        <span class="term-title" id="term-title">Terminal</span>
        <span class="term-status" id="term-status"></span>
        <button type="button" class="icon-btn" id="term-close" aria-label="Close terminal">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="term-body" id="term-body"></div>
    </div>
    <div class="preview-drawer" id="preview-drawer" hidden>
      <div class="preview-head">
        <button type="button" class="icon-btn" id="preview-back" aria-label="Back" title="Back">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input type="text" class="preview-url" id="preview-url" placeholder="Enter URL to preview..." aria-label="Preview URL">
        <button type="button" class="btn small" id="preview-go" title="Load URL">Go</button>
        <button type="button" class="btn small" id="preview-screenshot" title="Take screenshot and add to chat">Screenshot</button>
        <button type="button" class="btn small" id="preview-refresh" title="Refresh">Refresh</button>
        <select class="preview-size" id="preview-size" aria-label="Viewport size">
          <option value="100%|100%">Desktop</option>
          <option value="375px|812px">iPhone</option>
          <option value="768px|1024px">iPad</option>
          <option value="1280px|800px">Laptop</option>
        </select>
        <button type="button" class="icon-btn" id="preview-close" aria-label="Close preview">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="preview-body" id="preview-body">
        <iframe id="preview-frame" sandbox="allow-scripts allow-popups allow-forms allow-same-origin" title="Live preview"></iframe>
      </div>
    </div>
  </main>

  <aside class="panel" id="panel" hidden>
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button type="button" class="icon-btn" id="panel-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
