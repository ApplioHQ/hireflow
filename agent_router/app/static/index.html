<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/logo.svg?v=2">
<link rel="apple-touch-icon" href="/icon-192.png?v=2">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/logo.svg" alt="" width="24" height="24">
      <span>Agents</span>
    </div>
    <button class="new-task" id="new-chat" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      New chat
    </button>
    <input class="search" id="search" type="search" placeholder="Search chats" aria-label="Search chats">
    <nav class="task-list" id="projects" aria-label="Projects and chats"></nav>
    <button type="button" class="add-project" id="add-project">+ Add project folder</button>
    <div class="side-foot">
      <div class="side-links">
        <button type="button" data-panel="doctor">Agents</button>
        <button type="button" data-panel="memory">Memory</button>
        <button type="button" data-panel="diff">Changes</button>
      </div>
      <button type="button" class="install" id="install" hidden>Install app</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="head" id="head"></header>
    <section class="messages" id="messages" aria-live="polite"></section>
    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-box" id="composer-box">
        <div class="chips" id="chips" hidden></div>
        <textarea id="input" rows="1" placeholder="Ask anything or describe a change..."></textarea>
        <div class="drop-hint">Drop files to attach</div>
        <div class="composer-row">
          <button type="button" class="icon-btn attach-btn" id="attach-btn" aria-label="Attach files" title="Attach files (or drag, or paste a screenshot)">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.5 3.5 0 0 1 5 5l-8.6 8.6a2 2 0 0 1-2.8-2.8l7.9-7.9" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input type="file" id="file-input" multiple hidden>
          <select class="project-pick" id="project-pick" aria-label="Project"></select>
          <div class="agent-pick" id="agent-pick" role="radiogroup" aria-label="Who handles this"></div>
          <span class="composer-note" id="composer-note"></span>
          <button type="submit" class="send" id="send-btn" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </form>
  </main>

  <aside class="panel" id="panel" hidden>
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button type="button" class="icon-btn" id="panel-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
