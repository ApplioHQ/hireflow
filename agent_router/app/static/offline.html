<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applio Agents</title>
<style>
  :root { --bg: #faf9f7; --text: #1f1e1c; --muted: #6b6862; --code: #efece7; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1e1d; --text: #ecebe8; --muted: #a19e97; --code: #2c2b29; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 440px; text-align: center; }
  img { border-radius: 12px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: var(--muted); margin: 0 0 14px; }
  code { display: block; background: var(--code); padding: 10px 14px; border-radius: 8px; font-size: 14px; color: var(--text); }
  button { margin-top: 18px; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--muted); background: none; color: var(--text); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="" width="56" height="56">
  <h1>The agents server isn't running</h1>
  <p>Start it from the Applio agent-router folder, then try again:</p>
  <code>npm run app</code>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
