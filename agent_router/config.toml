# Agents config: which agents exist and how they work together.
# Projects (folders the agents work in) and chats live in ~/.applio-agents/, not here.
repo = ".."

# Seconds an agent may run before it is stopped.
agent_timeout = 1800
check_timeout = 600

# After a coder finishes and checks pass, automatically git commit and push the changed files.
auto_commit = true

# Hermes reads every message first. It answers anything that needs no file changes itself, and hands
# code work to a coder with a written brief. Each project picks its default coder (see /project).
[orchestrator]
agent = "hermes"
coders = ["chatgpt", "claude"]
# After a coder finishes, Hermes writes a short update for you.
report = true
# Hermes also names each new chat in a few words (set namer = "" to keep quick names only).
namer = "hermes"
# Hermes always works in a throwaway copy of the project, so it can read everything but never change
# the real files; only the coders edit.

# Each agent is a command run in the project folder. The prompt goes to stdin, or to a temp file if
# the command contains {prompt_file}. format = "stream-json" turns its JSON events into live progress.

[agents.claude]
# bypassPermissions gives Claude full access: file edits, shell commands, git push.
command = ["claude", "-p", "--permission-mode", "bypassPermissions", "--output-format", "stream-json", "--verbose"]
format = "stream-json"
# Continues Claude's earlier session when you follow up in the same chat.
resume = ["--resume", "{session_id}"]
# Lets Claude read attachments, which are stored outside the project folder.
add_dir = ["--add-dir", "{dir}"]
# Model selection: flag injected before the prompt, available models the user can pick.
model_flag = ["--model", "{model}"]
models = ["sonnet", "opus", "haiku"]

[agents.hermes]
# --yolo skips all of Hermes's approval checks so it never stalls on prompts.
# resume_command omits --yolo because hermes rejects policy changes on resume.
command = ["hermes", "chat", "-Q", "--oneshot", "--yolo", "--format", "stream-json", "-t", "file", "--max-turns", "3", "--query-file", "{prompt_file}"]
resume_command = ["hermes", "chat", "-Q", "--oneshot", "--format", "stream-json", "-t", "file", "--max-turns", "3", "--resume", "{session_id}", "--query-file", "{prompt_file}"]
format = "stream-json"
# The current Hermes model can't see images, so it hands screenshots to a coder.
vision = false
# Orchestrator gets a shorter timeout than coders (3 min vs 30 min).
timeout = 180
# Model selection: only free OpenRouter models allowed.
model_flag = ["--model", "{model}"]
models = [
    "nvidia/nemotron-3-ultra-550b-a55b:free",
    "deepseek/deepseek-chat-v3-0324:free",
    "google/gemma-3-27b-it:free",
    "meta-llama/llama-4-maverick:free",
    "qwen/qwen3-235b-a22b:free",
    "microsoft/phi-4-reasoning-plus:free",
]

[agents.chatgpt]
# ChatGPT through the Codex CLI. full-auto gives it full access including shell and git.
command = ["/Applications/ChatGPT.app/Contents/Resources/codex-cli/bin/codex", "exec", "--json", "--skip-git-repo-check", "-s", "full-auto", "-"]
resume_command = ["/Applications/ChatGPT.app/Contents/Resources/codex-cli/bin/codex", "exec", "resume", "--json", "--skip-git-repo-check", "-c", "sandbox_mode=\"full-auto\"", "{session_id}", "-"]
format = "stream-json"
# No add_dir: Codex reads any file by absolute path (full-disk read in workspace-write), so it sees
# attachments without it. `codex exec resume` rejects --add-dir anyway, which crashed follow-ups.
# Model selection: Codex uses -m flag.
model_flag = ["-m", "{model}"]
models = ["o3", "gpt-4.1", "codex-mini"]
