<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Career Coach | Applio</title>
<link rel="icon" href="logo.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Applio">
<link rel="stylesheet" href="css/styles.css">
<script src="js/theme.js"></script>
<style>
  /* ===== Layout + ambient animated aurora ===== */
  html, body.app-body { overflow-x: hidden; }
  .ca-wrap { position: relative; width: 100%; max-width: 820px; margin: 0 auto; padding: 24px 20px 0; display: flex; flex-direction: column; height: calc(100vh - 62px); box-sizing: border-box; }
  .ca-aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .ca-aurora i { position: absolute; display: block; border-radius: 50%; filter: blur(72px); opacity: .55; }
  .ca-aurora i:first-child { width: 520px; height: 520px; top: -150px; left: -90px; background: radial-gradient(circle, rgba(109,77,252,.32), transparent 70%); animation: caDrift1 19s ease-in-out infinite; }
  .ca-aurora i:last-child  { width: 460px; height: 460px; bottom: -130px; right: -70px; background: radial-gradient(circle, rgba(139,92,246,.28), transparent 70%); animation: caDrift2 23s ease-in-out infinite; }
  @keyframes caDrift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(64px,44px); } }
  @keyframes caDrift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-54px,-34px); } }

  /* ===== Header ===== */
  .ca-head { display: flex; align-items: center; gap: 11px; margin-bottom: 4px; }
  .ca-head h2 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 9px; }
  .ca-live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #10b981; background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.32); padding: 3px 10px; border-radius: 999px; letter-spacing: .03em; }
  .ca-live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #10b981; animation: caPulseDot 2s infinite; }
  @keyframes caPulseDot { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 70% { box-shadow: 0 0 0 6px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
  .ca-sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .ca-clear { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; margin-left: auto; transition: color .15s; }
  .ca-clear:hover { color: var(--text); }

  /* ===== Thread + messages ===== */
  .cc-thread { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 6px 2px 16px; scroll-behavior: smooth; }
  .ca-msg { display: flex; gap: 11px; max-width: 88%; }
  .ca-msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .ca-in { animation: caRise .42s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes caRise { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }

  .ca-avatar { flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; overflow: hidden; }
  .ca-msg.assistant .ca-avatar { background: transparent; }
  .ca-msg.user .ca-avatar { background: var(--bg-3); color: var(--text); }

  .ca-bubble { padding: 12px 15px; border-radius: 16px; font-size: 14.5px; line-height: 1.62; position: relative; }
  .ca-msg.assistant .ca-bubble { background: var(--bg-2); border: 1px solid var(--border); color: var(--text); border-top-left-radius: 5px; box-shadow: 0 4px 18px rgba(0,0,0,.18); }
  .ca-msg.user .ca-bubble { background: linear-gradient(135deg, var(--accent), #8a73f8); color: #fff; border-top-right-radius: 5px; box-shadow: 0 6px 20px rgba(109,77,252,.35); }
  .ca-bubble p { margin: 0 0 8px; } .ca-bubble p:last-child { margin-bottom: 0; }
  .ca-bubble ul { margin: 6px 0; padding-left: 18px; } .ca-bubble li { margin: 3px 0; }
  .ca-bubble strong { font-weight: 700; }
  /* word-by-word fade-in reveal for a fresh reply */
  .ccw { display: inline-block; opacity: 0; transform: translateY(3px); transition: opacity .45s ease, transform .45s ease; }
  .ccw-in .ccw { opacity: 1; transform: none; }

  /* ===== The moving "thinking" sphere (ApplioAI orb) ===== */
  .cc-think { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 16px auto 6px; }
  .cc-think::before { content: ""; position: absolute; left: 50%; top: 78px; transform: translate(-50%,-50%); width: 300px; height: 300px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(109,77,252,.32), rgba(109,77,252,.12) 42%, transparent 66%); filter: blur(12px); }
  .cc-think canvas { display: block; position: relative; }
  .cc-think-label { font-size: 13.5px; font-weight: 600; color: var(--muted);
    background: linear-gradient(90deg, var(--muted), var(--text), var(--muted)); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: ccShimmer 2.2s linear infinite; }
  @keyframes ccShimmer { from { background-position: 150% 0; } to { background-position: -100% 0; } }

  /* ===== Suggestion chips ===== */
  .cc-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 14px; }
  .ca-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 9px 15px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--border); color: var(--text); cursor: pointer; transition: color .18s, transform .12s, box-shadow .18s, border-color .18s; animation: caRise .5s cubic-bezier(.2,.8,.2,1) both; }
  .ca-chip:nth-child(1) { animation-delay: .05s; } .ca-chip:nth-child(2) { animation-delay: .12s; }
  .ca-chip:nth-child(3) { animation-delay: .19s; } .ca-chip:nth-child(4) { animation-delay: .26s; }
  .ca-chip svg { width: 15px; height: 15px; opacity: .7; flex-shrink: 0; transition: opacity .18s, transform .18s; }
  .ca-chip:hover { color: var(--accent); transform: translateY(-2px); border-color: transparent; box-shadow: 0 8px 22px rgba(109,77,252,.22), inset 0 0 0 1.5px rgba(109,77,252,.55); }
  .ca-chip:hover svg { opacity: 1; transform: scale(1.12); }

  /* ===== Gradient-glow AI composer ===== */
  .cc-composer { position: relative; border-radius: 24px; padding: 1.5px; margin-bottom: 18px;
    background: linear-gradient(135deg, rgba(109,77,252,.9), rgba(138,115,248,.35) 40%, rgba(255,255,255,.06) 70%, rgba(109,77,252,.6));
    background-size: 200% 200%; animation: ccShift 8s ease infinite; transition: filter .25s ease; }
  .cc-composer:focus-within { filter: drop-shadow(0 0 22px rgba(109,77,252,.4)); }
  @keyframes ccShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .cc-inner { position: relative; background: linear-gradient(180deg, #202026, #191920); border-radius: 22.5px; padding: 14px 14px 11px; overflow: hidden; }
  .cc-inner::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 80% at 50% -20%, rgba(109,77,252,.12), transparent 60%); }
  .cc-top { display: flex; align-items: flex-start; gap: 10px; position: relative; }
  .cc-spark { width: 19px; height: 19px; color: var(--accent-2); flex: 0 0 auto; margin-top: 6px; }
  .cc-field { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; resize: none; color: var(--text); font: inherit; font-size: 15px; line-height: 1.5; padding: 4px 2px; max-height: 150px; position: relative; }
  .cc-field:focus-visible { box-shadow: none !important; border-radius: 0 !important; }   /* kill the global textarea focus ring that caused the nested box */
  .cc-field::placeholder { color: var(--muted); }
  .cc-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; position: relative; }
  .cc-tools { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .cc-pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 12.5px; font-weight: 600; transition: all .15s ease; }
  .cc-pill svg { width: 15px; height: 15px; }
  .cc-pill:hover { color: var(--text); border-color: #44444d; }
  .cc-pill.on { color: #fff; background: linear-gradient(135deg, var(--accent), #8a73f8); border-color: transparent; box-shadow: 0 4px 14px rgba(109,77,252,.4); }
  .cc-send { flex: 0 0 auto; height: 38px; width: 38px; border-radius: 50%; border: 0; background: var(--bg-3); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .18s ease; }
  .cc-send svg { width: 18px; height: 18px; }
  .cc-send.ready { background: linear-gradient(135deg, var(--accent), #8a73f8); color: #fff; box-shadow: 0 6px 18px rgba(109,77,252,.5); }
  .cc-send.ready:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(109,77,252,.6); }
  .cc-send.recording { background: #ef4444; color: #fff; }
  .cc-send:disabled { opacity: .5; cursor: default; box-shadow: none; }
  .cc-wave { display: none; align-items: center; gap: 3px; height: 26px; padding: 0 6px; position: relative; }
  .cc-composer.rec .cc-wave { display: flex; }
  .cc-composer.rec .cc-top { display: none; }
  .cc-wave span { width: 3px; border-radius: 2px; background: rgba(109,77,252,.8); height: 6px; animation: ccWave 1s ease-in-out infinite; }
  @keyframes ccWave { 0%,100% { height: 6px; } 50% { height: 22px; } }

  /* ===== Hero empty state ===== */
  .ca-empty { text-align: center; color: var(--muted); margin: auto 0; position: relative; padding: 20px; animation: caRise .6s ease both; }
  /* orb as the hero mark (replaces the logo badge) */
  .ca-hero-orb { position: relative; display: grid; place-items: center; width: 126px; height: 126px; margin: 0 auto 20px; }
  .ca-hero-orb::before { content: ""; position: absolute; inset: -26px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(109,77,252,.32), rgba(109,77,252,.09) 46%, transparent 68%); filter: blur(12px); }
  .ca-hero-orb canvas { position: relative; display: block; }
  .ca-hero-badge { position: relative; width: 76px; height: 76px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; background: #fff; margin-bottom: 22px; box-shadow: 0 16px 44px rgba(109,77,252,.5), 0 4px 14px rgba(0,0,0,.35); animation: caFloat 4s ease-in-out infinite; }
  .ca-hero-badge::before { content: ""; position: absolute; inset: -3px; border-radius: 25px; z-index: 1; background: conic-gradient(from 0deg, #6d4dfc, #22d3ee, #8a73f8, #ec4899, #6d4dfc); animation: caSpin 5s linear infinite; }
  .ca-hero-badge::after { content: ""; position: absolute; inset: -26px; border-radius: 48px; z-index: 0; background: radial-gradient(closest-side, rgba(124,92,246,.55), rgba(109,77,252,.18) 52%, transparent 76%); animation: caPulse 4.5s ease-in-out infinite; }
  @keyframes caFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes caSpin { to { transform: rotate(360deg); } }
  @keyframes caPulse { 0%,100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
  .ca-hero-logo { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
  .ca-empty h1 { font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin: 0; background: linear-gradient(120deg, var(--text), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .ca-empty .ca-hero-sub { font-size: 14.5px; margin-top: 10px; }

  /* ===== Sleek scrollbars ===== */
  .cc-thread { scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.35) transparent; }
  .cc-thread::-webkit-scrollbar { width: 8px; }
  .cc-thread::-webkit-scrollbar-track { background: transparent; }
  .cc-thread::-webkit-scrollbar-thumb { background: rgba(148,163,184,.28); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  .cc-thread:hover::-webkit-scrollbar-thumb { background: rgba(148,163,184,.5); background-clip: padding-box; }

  @media (prefers-reduced-motion: reduce) {
    .ca-aurora i, .ca-hero-badge, .ca-hero-badge::before, .ca-hero-badge::after,
    .ca-live::before, .cc-think-label, .cc-composer { animation: none !important; }
    .ccw { transition: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<body class="app-body">
<div class="ca-aurora" aria-hidden="true"><i></i><i></i></div>
<header class="app-topbar">
  <div class="brand"><img src="logo.jpeg" width="32" height="32" class="brand-logo" alt="Applio"><span>Applio</span></div>
  <div class="topbar-right">
    <span id="health-badge"></span>
    <span id="plan-pill"></span>
    <button class="theme-toggle" onclick="toggleTheme()">☀️ Light</button>
    <button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button>
  </div>
</header>

<div class="ca-wrap">
  <div class="ca-head">
    <h2 id="ca-title"></h2>
    <span class="ca-live" id="ca-live">Online</span>
    <button class="ca-clear" id="ca-clear" onclick="clearChat()" style="display:none;">Clear</button>
  </div>
  <p class="ca-sub">Your AI career coach. It knows your resume, ask it anything and watch it think.</p>

  <div class="cc-thread" id="cc-thread"></div>

  <div class="cc-chips" id="cc-chips">
    <button class="ca-chip" onclick="askChip(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Review my resume and tell me what to fix</span></button>
    <button class="ca-chip" onclick="askChip(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg><span>Write me a cover letter opening</span></button>
    <button class="ca-chip" onclick="askChip(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>What roles am I a good fit for?</span></button>
    <button class="ca-chip" onclick="askChip(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Prep me for a behavioral interview</span></button>
  </div>

  <form class="cc-composer" id="cc-composer" onsubmit="return false;">
    <div class="cc-inner">
      <div class="cc-top" id="cc-top"></div>
      <div class="cc-wave" id="cc-wave"></div>
      <div class="cc-bar">
        <div class="cc-tools">
          <button type="button" class="cc-pill" data-steer="tailor" title="Tailor to a role"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13l2 2 4-4"/></svg><span>Tailor</span></button>
          <button type="button" class="cc-pill" data-steer="interview" title="Interview prep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0z"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg><span>Interview</span></button>
          <button type="button" class="cc-pill" data-steer="rewrite" title="Rewrite stronger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Rewrite</span></button>
        </div>
        <button type="button" class="cc-send" id="cc-send" onclick="onSendBtn()" aria-label="Send"></button>
      </div>
    </div>
  </form>
</div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/notify.js"></script>
<script src="js/plan.js"></script>
<script src="js/health-badge.js"></script>
<script src="js/applio-ai.js"></script>
<script>
const API = window.HIREFLOW_CONFIG.API_URL;
const TOKEN = localStorage.getItem('hf_token');
const IS_ANON = !TOKEN; if (IS_ANON) window.addEventListener('load', initAnonTopbar);
const STORE = 'hf_assistant_chat';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function signOut(){ localStorage.removeItem('hf_token'); localStorage.removeItem('hf_email'); location.href='index'; }
function _resume(){ try { return JSON.parse(localStorage.getItem('hf_resume') || '{}') || {}; } catch { return {}; } }
function _reduced(){ try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } }
function _isFreeUser(){ return typeof isFree === 'function' ? isFree() : false; }

let messages = (function(){ try { const m = JSON.parse(localStorage.getItem(STORE) || '[]'); return Array.isArray(m) ? m : []; } catch { return []; } })();
let busy = false;

document.getElementById('ca-title').innerHTML = ApplioAI.markHTML(26) + '<span>Career Coach</span>';
// Composer: a light violet spark leads the input (the real logo lives on avatars).
document.getElementById('cc-top').innerHTML =
  '<svg class="cc-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>' +
  '<textarea class="cc-field" id="cc-field" rows="1" maxlength="600" placeholder="Ask your career coach anything…" spellcheck="false" oninput="autosize(this);refreshSend()" onkeydown="onKey(event)"></textarea>';
(function(){ let h=''; for(let i=0;i<28;i++) h+='<span style="animation-delay:'+(i*0.045).toFixed(2)+'s"></span>'; document.getElementById('cc-wave').innerHTML=h; })();

const HERO = '<div class="ca-empty"><div class="ca-hero-orb"><canvas id="hero-orb"></canvas></div><h1>Applio AI</h1><div class="ca-hero-sub">Your personal career coach. It knows your resume. Ask it anything.</div></div>';

// The empty-state hero shows the orb at rest (ambient), not the logo badge.
let heroOrb = null;
function mountHeroOrb(){
  killHeroOrb();
  const c = document.getElementById('hero-orb'); if (!c) return;
  try { heroOrb = ApplioAI.thinkingOrb(c, { size: 124, reduced: _reduced() }); heroOrb.idle(); } catch (e) { heroOrb = null; }
}
function killHeroOrb(){ if (heroOrb) { try { heroOrb.destroy(); } catch (e) {} heroOrb = null; } }

/* ── light markdown ── */
function fmtFull(text){
  const lines = esc(text).split('\n'); let html='', inUl=false;
  const closeUl=()=>{ if(inUl){ html+='</ul>'; inUl=false; } };
  for(let raw of lines){ const line=raw.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    const m=line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
    if(m){ if(!inUl){ html+='<ul>'; inUl=true; } html+='<li>'+m[1]+'</li>'; }
    else if(line.trim()===''){ closeUl(); } else { closeUl(); html+='<p>'+line+'</p>'; } }
  closeUl(); return html || '<p></p>';
}
// Word spans for the fade-in reveal (bold preserved, newlines kept).
function fmtWords(text){
  const e = esc(text).replace(/\*\*(.+?)\*\*/g,'\u0001$1\u0002');
  const parts = e.split(/(\s+)/);
  return '<p>' + parts.map(t => {
    if(/^\s+$/.test(t)) return t.replace(/\n/g,'<br>');
    if(t==='') return '';
    const b = t.indexOf('\u0001') > -1, w = t.replace(/[\u0001\u0002]/g,'');
    return '<span class="ccw">' + (b ? '<strong>'+w+'</strong>' : w) + '</span>';
  }).join('') + '</p>';
}

function scrollThread(){ const t=document.getElementById('cc-thread'); if(t) t.scrollTop = t.scrollHeight; }

function addBubble(m, reveal){
  const thread = document.getElementById('cc-thread');
  const el = document.createElement('div');
  el.className = 'ca-msg ' + m.role + ' ca-in';
  const avatar = m.role === 'user' ? '<div class="ca-avatar">You</div>' : '<div class="ca-avatar">' + ApplioAI.markHTML(32) + '</div>';
  el.innerHTML = avatar + '<div class="ca-bubble"></div>';
  thread.appendChild(el);
  const bubble = el.querySelector('.ca-bubble');
  if (m.role === 'user') { bubble.innerHTML = '<p>' + esc(m.content).replace(/\n/g,'<br>') + '</p>'; }
  else if (reveal) { revealWords(bubble, m.content); }
  else { bubble.innerHTML = fmtFull(m.content); }
  scrollThread();
}

// Fade the answer in word by word, then swap to full markdown (lists/paragraphs).
function revealWords(bubble, text){
  bubble.innerHTML = fmtWords(text);
  const spans = [].slice.call(bubble.querySelectorAll('.ccw'));
  if (_reduced() || !spans.length) { bubble.innerHTML = fmtFull(text); scrollThread(); return; }
  spans.forEach((el, i) => { el.style.transitionDelay = (i * 0.022) + 's'; });
  requestAnimationFrame(() => requestAnimationFrame(() => bubble.classList.add('ccw-in')));
  const total = spans.length * 22 + 480;
  let t = 0; const iv = setInterval(scrollThread, 120);
  setTimeout(() => { clearInterval(iv); bubble.innerHTML = fmtFull(text); scrollThread(); }, Math.min(total, 4200));
}

function _save(){ try { localStorage.setItem(STORE, JSON.stringify(messages.slice(-30))); } catch(e){} }
function renderInit(){
  const thread = document.getElementById('cc-thread');
  killHeroOrb(); thread.innerHTML = '';
  if (!messages.length) { thread.innerHTML = HERO; mountHeroOrb(); document.getElementById('cc-chips').style.display = 'flex'; document.getElementById('ca-clear').style.display = 'none'; return; }
  document.getElementById('cc-chips').style.display = 'none';
  document.getElementById('ca-clear').style.display = '';
  messages.forEach(m => addBubble(m, false));
}
function clearChat(){ if (busy) return; messages = []; _save(); renderInit(); document.getElementById('cc-field').focus(); }

/* ── composer: send button (mic ↔ send ↔ stop), pills, voice ── */
const _SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recording = false, _recog = null;
const IC = {
  mic:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>'
};
function autosize(el){ el = el || document.getElementById('cc-field'); el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,150)+'px'; }
function refreshSend(){
  const b = document.getElementById('cc-send'); if (!b) return;
  if (busy) { b.className='cc-send'; b.disabled=true; b.innerHTML=IC.stop; return; }
  const has = (document.getElementById('cc-field').value || '').trim().length > 0;
  b.disabled = false;
  if (recording) { b.className='cc-send recording'; b.innerHTML=IC.stop; b.title='Stop recording'; }
  else if (has) { b.className='cc-send ready'; b.innerHTML=IC.send; b.title='Send'; }
  else { b.className='cc-send'; b.innerHTML = _SR ? IC.mic : IC.send; b.disabled = !_SR; b.title = _SR ? 'Record a voice message' : 'Type a message'; }
}
function onSendBtn(){ if (busy) return; if (recording) { stopRec(); return; }
  if ((document.getElementById('cc-field').value || '').trim()) send(); else if (_SR) startRec(); }
function onKey(e){ if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function askChip(btn){ const f = document.getElementById('cc-field'); f.value = (btn.textContent || '').trim(); refreshSend(); send(); }

let _steer = null;
const STEER = { tailor: 'Tailor my resume for this: ', interview: 'Help me prep for an interview: ', rewrite: 'Rewrite this stronger: ' };
function applySteer(t){ return _steer && STEER[_steer] ? STEER[_steer] + t : t; }
function clearSteer(){ _steer = null; document.querySelectorAll('.cc-pill.on').forEach(p => p.classList.remove('on')); document.getElementById('cc-field').placeholder = 'Ask your career coach anything…'; }
document.querySelectorAll('.cc-pill').forEach(p => p.addEventListener('click', () => {
  const was = p.classList.contains('on'); document.querySelectorAll('.cc-pill').forEach(o => o.classList.remove('on'));
  const f = document.getElementById('cc-field');
  if (was) { _steer = null; f.placeholder = 'Ask your career coach anything…'; }
  else { p.classList.add('on'); _steer = p.getAttribute('data-steer');
    const ph = { tailor: 'Paste a role, or ask me to tailor your resume…', interview: 'Ask for questions, or practice an answer…', rewrite: 'Paste a bullet or summary to rewrite…' };
    f.placeholder = ph[_steer] || 'Ask your career coach anything…'; f.focus(); }
}));

function startRec(){ if (!_SR || recording) return; _recog = new _SR(); _recog.continuous = true; _recog.interimResults = true; _recog.lang = navigator.language || 'en-US';
  const f = document.getElementById('cc-field'), base = f.value ? f.value.replace(/\s+$/,'') + ' ' : ''; let fin = '';
  _recog.onresult = ev => { let interim = ''; for (let i = ev.resultIndex; i < ev.results.length; i++){ const t = ev.results[i][0].transcript; if (ev.results[i].isFinal) fin += t + ' '; else interim += t; } f.value = base + fin + interim; autosize(f); };
  _recog.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') toast('Microphone blocked. Allow mic access, or type instead.', { type:'warn' }); stopRec(); };
  _recog.onend = () => { if (recording) { try { _recog.start(); } catch(e){ stopRec(); } } };
  try { _recog.start(); } catch(e){ return; } recording = true; document.getElementById('cc-composer').classList.add('rec'); refreshSend(); }
function stopRec(){ recording = false; try { _recog && _recog.stop(); } catch(e){} _recog = null; document.getElementById('cc-composer').classList.remove('rec'); refreshSend(); document.getElementById('cc-field').focus(); }

/* ── send: user bubble → thinking sphere → answer bubble ── */
async function send(){
  if (IS_ANON) { promptSignup('chat with your AI career coach'); return; }
  if (_isFreeUser()) { _showPremiumGate(); return; }
  const field = document.getElementById('cc-field');
  const text = (field.value || '').trim();
  if (!text || busy) return;
  if (recording) stopRec();
  if (!messages.length) { killHeroOrb(); document.getElementById('cc-thread').innerHTML = ''; }   // clear hero
  document.getElementById('cc-chips').style.display = 'none';

  const payload = applySteer(text);
  messages.push({ role: 'user', content: payload });
  addBubble({ role: 'user', content: payload }, false);
  field.value = ''; autosize(field); clearSteer();
  busy = true; _save(); refreshSend();

  // the moving sphere "thinking" moment
  const thread = document.getElementById('cc-thread');
  const row = document.createElement('div'); row.className = 'cc-think ca-in';
  row.innerHTML = '<canvas></canvas><div class="cc-think-label">Thinking</div>';
  thread.appendChild(row); scrollThread();
  const label = row.querySelector('.cc-think-label');
  let orb = null;
  try {
    orb = ApplioAI.thinkingOrb(row.querySelector('canvas'), { size: 156, reduced: _reduced() });
    const LBL = ['Thinking', 'Analyzing', 'Searching', 'Composing'];
    orb.think(i => { label.textContent = LBL[i % LBL.length]; });
  } catch (e) { orb = null; }

  let reply;
  try {
    const r = await fetch(API + '/ai/assistant', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
      body: JSON.stringify({ messages: messages, resume: _resume() })
    });
    if (r.status === 402) { if (typeof showUpgradeModal === 'function') showUpgradeModal('ai', 'assistant'); reply = 'Career Coach is a Premium feature.'; }
    else {
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { const m = data.error || ''; reply = /usage limit|limit reached|quota|neuron|429/i.test(m)
        ? 'The daily AI limit was reached. It resets shortly, please try again later.'
        : 'The AI is busy right now, give it a few seconds and try again.'; }
      else reply = data.reply || 'Sorry, I could not generate a response, please try again.';
    }
  } catch (e) { reply = 'The AI is busy right now, give it a few seconds and try again.'; }

  label.textContent = 'Done';
  const finish = () => {
    row.remove();
    messages.push({ role: 'assistant', content: reply }); _save();
    addBubble({ role: 'assistant', content: reply }, true);
    document.getElementById('ca-clear').style.display = '';
    busy = false; refreshSend(); field.focus();
  };
  if (orb) orb.resolve(() => { try { orb.destroy(); } catch(e){} finish(); }); else finish();
}

/* Premium gate (kept as a guard; never fires while the product is 100% free). */
function _showPremiumGate(){
  const live = document.getElementById('ca-live'); if (live) live.style.display = 'none';
  document.getElementById('cc-chips').style.display = 'none';
  document.querySelector('.cc-composer').style.display = 'none';
  document.getElementById('cc-thread').innerHTML =
    '<div class="ca-empty"><div class="ca-hero-badge"><img src="logo.jpeg" alt="Applio" class="ca-hero-logo"></div>'
    + '<h1>Career Coach is Premium</h1>'
    + '<div class="ca-hero-sub" style="max-width:420px;margin:8px auto 18px;">Your personal AI coach that knows your resume. All free and unlimited.</div>'
    + '<a class="btn btn-primary" href="pricing">See plans</a></div>';
}

renderInit(); refreshSend();
(async () => {
  if (typeof loadCurrentUser === 'function') { await loadCurrentUser(); if (window.renderPlanPill) renderPlanPill(); }
  if (_isFreeUser()) _showPremiumGate();
  try { document.getElementById('cc-field').focus(); } catch(e){}
})();
</script>
