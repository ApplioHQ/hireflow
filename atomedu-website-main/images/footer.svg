<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 360" fill="none" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b242e"/>
      <stop offset="55%" stop-color="#161e27"/>
      <stop offset="100%" stop-color="#121920"/>
    </linearGradient>
    <radialGradient id="nuc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8a179" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#bf5a2e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#bf5a2e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1800" height="360" fill="url(#fg)"/>

  <!-- atom, vertically centered so wide/short crops stay clean -->
  <g transform="translate(1340 180)">
    <ellipse rx="430" ry="150" fill="none" stroke="#33404d" stroke-width="1.3"/>
    <ellipse rx="430" ry="150" fill="none" stroke="#33404d" stroke-width="1.3" transform="rotate(60)"/>
    <ellipse rx="430" ry="150" fill="none" stroke="#33404d" stroke-width="1.3" transform="rotate(120)"/>
    <ellipse rx="430" ry="150" fill="none" stroke="#9a5a3a" stroke-width="1.3" opacity="0.6" transform="rotate(25)"/>
    <circle r="170" fill="url(#nuc)"/>
    <circle r="18" fill="#e8a179"/>
    <circle cx="430" cy="0" r="7" fill="#e8dfd3"/>
    <g transform="rotate(60)"><circle cx="430" cy="0" r="6" fill="#cdd4db" opacity="0.85"/></g>
    <g transform="rotate(120)"><circle cx="430" cy="0" r="6" fill="#cdd4db" opacity="0.7"/></g>
    <g transform="rotate(205)"><circle cx="430" cy="0" r="5" fill="#9fb0bf" opacity="0.7"/></g>
  </g>

  <!-- faint equation marks on the left, clear of the text and the fade edge -->
  <g fill="#3a4654" opacity="0.4" font-family="'Fraunces',Georgia,serif" font-style="italic">
    <text x="120" y="150" font-size="34">E = mc&#178;</text>
    <text x="150" y="235" font-size="26">F = ma</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
