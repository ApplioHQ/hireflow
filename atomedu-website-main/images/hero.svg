<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" fill="none" font-family="'Space Grotesk', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#fbeee4"/>
      <stop offset="100%" stop-color="#fffdf9"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ece4d8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="720" height="600" fill="url(#glow)"/>
  <rect width="720" height="600" fill="url(#grid)" opacity="0.7"/>

  <!-- subject tags, physics highlighted -->
  <g font-size="15" font-weight="600">
    <g transform="translate(60 70)">
      <rect x="0" y="0" width="112" height="34" rx="17" fill="#f3e3d8" stroke="#bf5a2e"/>
      <circle cx="22" cy="17" r="4" fill="#bf5a2e"/>
      <text x="36" y="22" fill="#a2461f">Physics</text>
    </g>
    <g transform="translate(520 110)" font-weight="500">
      <rect x="0" y="0" width="92" height="32" rx="16" fill="#fffdf9" stroke="#d8d2c8"/>
      <circle cx="20" cy="16" r="4" fill="#c3bcae"/>
      <text x="32" y="21" fill="#6d6a61" font-size="14">Biology</text>
    </g>
    <g transform="translate(548 470)" font-weight="500">
      <rect x="0" y="0" width="108" height="32" rx="16" fill="#fffdf9" stroke="#d8d2c8"/>
      <circle cx="20" cy="16" r="4" fill="#c3bcae"/>
      <text x="32" y="21" fill="#6d6a61" font-size="14">Chemistry</text>
    </g>
    <g transform="translate(70 486)" font-weight="500">
      <rect x="0" y="0" width="78" height="32" rx="16" fill="#fffdf9" stroke="#d8d2c8"/>
      <circle cx="20" cy="16" r="4" fill="#c3bcae"/>
      <text x="32" y="21" fill="#6d6a61" font-size="14">Math</text>
    </g>
  </g>

  <!-- atom -->
  <g transform="translate(360 300)">
    <ellipse rx="190" ry="72" fill="none" stroke="#1f2a36" stroke-width="2.2" opacity="0.85"/>
    <ellipse rx="190" ry="72" fill="none" stroke="#1f2a36" stroke-width="2.2" opacity="0.85" transform="rotate(60)"/>
    <ellipse rx="190" ry="72" fill="none" stroke="#1f2a36" stroke-width="2.2" opacity="0.85" transform="rotate(120)"/>

    <!-- electrons -->
    <circle cx="190" cy="0" r="8" fill="#1f2a36"/>
    <g transform="rotate(60)"><circle cx="190" cy="0" r="8" fill="#1f2a36"/></g>
    <g transform="rotate(120)"><circle cx="190" cy="0" r="8" fill="#1f2a36"/></g>
    <g transform="rotate(240)"><circle cx="190" cy="0" r="6" fill="#c3bcae"/></g>

    <!-- nucleus -->
    <circle r="30" fill="#bf5a2e"/>
    <circle r="30" fill="none" stroke="#a2461f" stroke-width="2"/>
    <circle r="46" fill="none" stroke="#bf5a2e" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- equations, hand-placed like margin notes -->
  <g fill="#3a4654" font-style="italic" font-family="'Fraunces','Georgia',serif">
    <text x="120" y="250" font-size="26">F = ma</text>
    <text x="520" y="300" font-size="24">E = mc&#178;</text>
    <text x="250" y="540" font-size="22">v = u + at</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
