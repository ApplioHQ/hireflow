<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join an atomEDU Room</title><meta name="robots" content="noindex,follow"><link rel="icon" href="images/logo.svg"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="teacher.css"><script src="teacher-config.js"></script><script src="teacher-common.js" defer></script><script src="student-app.js" defer></script></head><body class="join-page" data-student-page="join"><header class="teacher-header"><a class="teacher-back" href="/">← <span>atomEDU home</span></a><span class="teacher-brand">atomEDU <b>Join</b></span><a class="header-action" href="/teachers">Teachers</a></header><main class="join-main"><form class="join-card" id="join-form"><p class="eyebrow">Your room is waiting</p><h1>Join with a code.</h1><p>Enter the six-digit Orbit Room code or eight-character quiz ID from your teacher.</p><div class="field"><label for="join-code">Room code or quiz ID</label><input class="join-code" id="join-code" inputmode="text" maxlength="8" autocomplete="off" required placeholder="123456"></div><div class="field"><label for="join-name">Your name</label><input id="join-name" maxlength="40" autocomplete="name" required placeholder="First name and last initial"></div><div class="field" id="password-field" hidden><label for="join-password">Quiz password</label><input id="join-password" type="password" maxlength="120" autocomplete="off"></div><button class="button button-primary button-block" type="submit">Continue →</button><div class="error-box" id="join-error" hidden></div></form></main></body></html>
