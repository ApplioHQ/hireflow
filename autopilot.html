<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "@id": "https://appliohq.com/autopilot#webapp",
  "name": "Applio Autopilot",
  "applicationCategory": "BusinessApplication",
  "operatingSystem": "Web",
  "description": "Free AI tool that automates your job applications. Finds matching jobs, tailors your resume and cover letter for each, and tracks applications in a Kanban board. All free.",
  "url": "https://appliohq.com/autopilot",
  "publisher": { "@id": "https://appliohq.com/#organization" },
  "featureList": [
    "Auto-finds matching jobs from multiple sources",
    "Tailors resume and cover letter per application",
    "Kanban application tracker",
    "One-click apply for supported sites"
  ],
  "offers": {
    "@type": "Offer",
    "name": "Free",
    "price": "0",
    "priceCurrency": "USD",
    "description": "Completely free, no credit card required"
  }
}
</script>
<style>
  .ap-wrap { max-width: 1200px; margin: 0 auto; padding: 20px 20px 80px; }

  /* ---- Centered empty state ---- */
  .ap-input-area { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 180px); transition: min-height .4s var(--ease-out); }
  .ap-input-area.ap-has-results { min-height: 0; justify-content: flex-start; }
  .ap-hero { text-align: center; margin-bottom: 24px; }
  .ap-hero h1 { font-size: 22px; font-weight: 800; color: var(--text); margin: 0 0 6px; }
  .ap-hero p { font-size: 14px; color: var(--muted); max-width: 420px; margin: 0 auto; line-height: 1.5; }

  /* ---- Textarea card with integrated toolbar ---- */
  .ap-ta-card { width: 100%; max-width: 660px; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .ap-ta-card:focus-within { border-color: var(--accent); box-shadow: var(--ring); }
  .ap-ta { display: block; width: 100%; box-sizing: border-box; min-height: 100px; max-height: 240px; padding: 14px 16px; background: transparent; border: none; color: var(--text); font-size: 13.5px; line-height: 1.6; resize: vertical; font-family: inherit; }
  .ap-ta:focus { outline: none; }
  .ap-ta-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--border); }
  .ap-ta-left { display: flex; gap: 6px; }
  .ap-paste-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 5px 10px; cursor: pointer; font-family: inherit; transition: background var(--dur) var(--ease); }
  .ap-paste-btn:hover { background: var(--bg-3); color: var(--text); }
  .ap-run-btn { flex-shrink: 0; padding: 8px 22px; }

  /* ---- Options row ---- */
  .ap-opts-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; width: 100%; max-width: 660px; }
  .ap-opt-field { display: flex; align-items: center; gap: 0; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
  .ap-opt-field label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 6px 0 10px; white-space: nowrap; }
  .ap-input, .ap-select { box-sizing: border-box; padding: 7px 10px 7px 0; font: inherit; font-size: 12.5px; background: transparent; border: none; color: var(--text); width: 100px; }
  .ap-select { width: 110px; }
  .ap-input:focus, .ap-select:focus { outline: none; }
  .ap-resume-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); margin-left: auto; }
  .ap-resume-pill a { color: var(--accent); font-weight: 600; }
  .ap-resume-pill .ap-rp-ok { color: #22c55e; }

  /* ---- Feature indicators ---- */
  .ap-features { display: flex; gap: 18px; justify-content: center; margin-top: 22px; }
  .ap-feat { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .ap-feat .ico { opacity: .6; }
  .ap-shortcut { text-align: center; margin-top: 14px; font-size: 11px; color: var(--muted); }
  .ap-shortcut kbd { display: inline-block; padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px; font-size: 10px; font-family: var(--font-mono, monospace); background: var(--bg-1); margin: 0 1px; }

  /* ---- Loading ---- */
  .ap-loading { display: none; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin-top: 10px; }
  .ap-loading.show { display: flex; }
  .ap-spin { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: ap-spin 0.7s linear infinite; }
  @keyframes ap-spin { to { transform: rotate(360deg); } }

  /* ---- Two-column results ---- */
  .ap-results { margin-top: 16px; display: none; }
  .ap-results.show { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; }
  @media (max-width: 800px) { .ap-results.show { grid-template-columns: 1fr; } }

  /* Shared card */
  .ap-card { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px; animation: apFadeUp .4s var(--ease-out) both; }
  @keyframes apFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .ap-card { animation: none; } }
  .ap-card h2 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 12px; }
  .ap-card .ap-card-sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }

  /* ---- Left scorecard ---- */
  .ap-scorecard { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 16px; align-self: start; }
  @media (max-width: 800px) { .ap-scorecard { position: static; } }

  /* Verdict ring */
  .ap-verdict { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .ap-ring { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
  .ap-ring .ap-ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; }
  .ap-verdict-text { flex: 1; }
  .ap-verdict-label { font-size: 16px; font-weight: 800; }
  .ap-verdict-why { color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.45; }

  /* Score bars */
  .ap-bars { display: flex; flex-direction: column; gap: 0; }
  .ap-bar-row { display: flex; justify-content: space-between; font-size: 12px; padding-top: 8px; }
  .ap-bar-row .label { color: var(--muted); }
  .ap-bar-row .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .ap-bar-track { height: 4px; background: var(--bg-2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .ap-bar-fill { height: 100%; border-radius: 2px; transition: width .6s var(--ease-out); }

  /* ATS improvement inline */
  .ap-ats-delta { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r-md); background: rgba(34,197,94,.06); border: 1px solid rgba(34,197,94,.12); margin-top: 14px; font-size: 12px; }
  .ap-ats-num { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ap-ats-arrow { color: var(--muted); }
  .ap-ats-badge { font-size: 11px; font-weight: 700; color: #22c55e; background: rgba(34,197,94,.12); padding: 2px 8px; border-radius: var(--r-full); margin-left: auto; }

  /* Keywords */
  .ap-chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: var(--r-full); margin: 2px 3px 0 0; }
  .ap-chip-ok { background: rgba(34,197,94,.12); color: #4ade80; border: 1px solid rgba(34,197,94,.2); }
  .ap-chip-no { background: rgba(239,68,68,.1); color: #f87171; border: 1px solid rgba(239,68,68,.2); }
  .ap-kw-matched { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-bottom: 8px; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .ap-kw-matched:hover { color: var(--accent); }
  .ap-kw-matched svg { width: 12px; height: 12px; transition: transform .2s; }
  .ap-kw-matched.open svg { transform: rotate(180deg); }
  .ap-kw-expanded { display: none; margin-bottom: 8px; }
  .ap-kw-expanded.show { display: block; }

  /* ---- Right content column ---- */
  .ap-content { display: flex; flex-direction: column; gap: 12px; }

  /* Apply-all bar */
  .ap-apply-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: color-mix(in srgb, var(--accent) 8%, var(--bg-1)); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: var(--r-lg); }
  .ap-apply-bar .ap-ab-text { flex: 1; font-size: 13px; color: var(--text); font-weight: 600; }
  .ap-apply-bar .ap-ab-sub { font-weight: 400; color: var(--muted); font-size: 12px; }

  /* Section headers inside content cards */
  .ap-sec-hd { font-size: 14px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .ap-sec-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

  /* Diff blocks */
  .ap-diff { border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; margin-bottom: 8px; }
  .ap-diff-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 4px 10px; }
  .ap-diff-label-old { background: rgba(239,68,68,.08); color: rgba(239,68,68,.6); }
  .ap-diff-label-new { background: rgba(34,197,94,.08); color: rgba(34,197,94,.6); }
  .ap-diff-before { padding: 8px 10px; font-size: 12.5px; color: var(--muted); background: rgba(239,68,68,.03); line-height: 1.5; text-decoration: line-through; text-decoration-color: rgba(239,68,68,.3); }
  .ap-diff-after { padding: 8px 10px; font-size: 12.5px; color: var(--text); background: rgba(34,197,94,.03); line-height: 1.5; }

  /* Side-by-side bullet diffs */
  .ap-bullet-diff { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-radius: var(--r-sm); overflow: hidden; margin-bottom: 6px; }
  @media (max-width: 800px) { .ap-bullet-diff { grid-template-columns: 1fr; } }
  .ap-bullet-side { padding: 8px 10px; font-size: 12px; line-height: 1.5; }
  .ap-bullet-old { background: rgba(239,68,68,.03); color: var(--muted); }
  .ap-bullet-new { background: rgba(34,197,94,.03); color: var(--text); }

  /* Emphasis list */
  .ap-list { list-style: none; padding: 0; margin: 0; }
  .ap-list li { display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; line-height: 1.45; margin-bottom: 5px; color: var(--muted); }
  .ap-list li .arrow { color: var(--accent); flex-shrink: 0; }

  /* Cover letter */
  .ap-cover { white-space: pre-wrap; font-size: 13px; line-height: 1.7; color: var(--text); background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 14px 16px; }
  .ap-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  /* Next step card */
  .ap-next { display: flex; align-items: center; gap: 12px; }
  .ap-next-icon { width: 36px; height: 36px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 12%, transparent); display: grid; place-items: center; flex-shrink: 0; color: var(--accent); }
  .ap-next-text { flex: 1; }
  .ap-next-title { font-size: 13px; font-weight: 700; }
  .ap-next-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

  .ap-fail { font-size: 12.5px; color: #f59e0b; margin-top: 10px; }
  .ap-upgrade { text-align: center; padding: 26px; }
  .ap-upgrade h3 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
  .ap-upgrade p { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
</style>
<link rel="manifest" href="/manifest.json">

<body class="app-body-scroll">
<header class="app-topbar">
  <div class="brand"><img src="logo-mark.png" width="32" height="32" class="brand-logo" alt="Applio"><span>Applio</span></div>
  <div class="topbar-right">
    <span id="health-badge"></span>
    <span id="plan-pill"></span>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
      <span class="icon"></span>
      <span class="label"></span>
    </button>
    <button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button>
  </div>
</header>

<main class="ap-wrap">
  <div class="ap-input-area" id="ap-input-area">
    <div class="ap-hero" id="ap-hero-block">
      <h1>Application Autopilot</h1>
      <p>Paste a job description. Get a fit verdict, tailored resume, cover letter, and missing keywords.</p>
    </div>
    <div class="ap-ta-card">
      <textarea id="ap-jd" class="ap-ta" placeholder="Paste the full job description here..."></textarea>
      <div class="ap-ta-toolbar">
        <div class="ap-ta-left">
          <button class="ap-paste-btn" id="ap-paste-clip" type="button"></button>
        </div>
        <button class="btn btn-primary ap-run-btn" id="ap-run"></button>
      </div>
    </div>
    <div class="ap-opts-row">
      <div class="ap-opt-field">
        <label for="ap-role">Role</label>
        <input id="ap-role" class="ap-input" type="text" placeholder="e.g. Senior PM" maxlength="120">
      </div>
      <div class="ap-opt-field">
        <label for="ap-company">Company</label>
        <input id="ap-company" class="ap-input" type="text" placeholder="e.g. Acme" maxlength="120">
      </div>
      <div class="ap-opt-field">
        <label for="ap-tone">Tone</label>
        <select id="ap-tone" class="ap-select">
          <option value="professional">Professional</option>
          <option value="enthusiastic">Enthusiastic</option>
          <option value="confident">Confident</option>
          <option value="warm">Warm</option>
        </select>
      </div>
      <span class="ap-resume-pill" id="ap-resume-note"></span>
    </div>
    <div class="ap-features" id="ap-features">
      <span class="ap-feat"><span class="ico ico-sm" id="ap-feat-target"></span> Fit score</span>
      <span class="ap-feat"><span class="ico ico-sm" id="ap-feat-arrows"></span> Tailored bullets</span>
      <span class="ap-feat"><span class="ico ico-sm" id="ap-feat-mail"></span> Cover letter</span>
      <span class="ap-feat"><span class="ico ico-sm" id="ap-feat-tag"></span> Missing keywords</span>
    </div>
    <div class="ap-shortcut" id="ap-shortcut"><kbd>Cmd</kbd> + <kbd>Enter</kbd> to run</div>
    <div class="ap-loading" id="ap-loading"><span class="ap-spin"></span> <span id="ap-loading-text">Tailoring your application... this takes ~15 seconds</span></div>
  </div>

  <div class="ap-results" id="ap-results"></div>
</main>

<script>
(async function() {
  try {
    await loadCurrentUser();
    document.getElementById('ap-run').innerHTML = ICON('sparkle') + ' <span>Run Autopilot</span>';
    var planPill = document.getElementById('plan-pill');
    if (isPaid()) planPill.innerHTML = '<button class="pill success" onclick="openBillingPortal()" style="cursor:pointer;">'+ICON('crown','ico ico-sm')+' '+planLabel()+'</button>';
    else planPill.innerHTML = '';
  } catch(e) {
    document.getElementById('ap-run').innerHTML = ICON('sparkle') + ' <span>Run Autopilot</span>';
  }
  // Feature icons
  var fi = {target:'ap-feat-target',arrows:'ap-feat-arrows',mail:'ap-feat-mail',tag:'ap-feat-tag'};
  var names = {target:'target',arrows:'arrows-exchange',mail:'mail',tag:'tag'};
  for (var k in fi) { var el = document.getElementById(fi[k]); if (el && typeof ICON === 'function') el.innerHTML = ICON(names[k],'ico ico-sm'); }
  // Paste button icon
  var pb = document.getElementById('ap-paste-clip');
  if (pb && typeof ICON === 'function') pb.innerHTML = ICON('clipboard','ico ico-sm') + ' Paste from clipboard';
})();
// Paste from clipboard button
document.getElementById('ap-paste-clip').addEventListener('click', function() {
  navigator.clipboard.readText().then(function(text) {
    if (text && text.trim()) {
      var ta = document.getElementById('ap-jd');
      ta.value = text.trim();
      ta.dispatchEvent(new Event('input'));
      ta.focus();
    }
  }).catch(function() {});
});
// Cmd+Enter to run
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    var run = document.getElementById('ap-run');
    if (run && !run.disabled) run.click();
  }
});
// Detect platform for shortcut hint
(function() {
  var sc = document.getElementById('ap-shortcut');
  if (sc && !/Mac|iPhone|iPad/.test(navigator.userAgent)) {
    sc.innerHTML = '<kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run';
  }
})();
</script>
