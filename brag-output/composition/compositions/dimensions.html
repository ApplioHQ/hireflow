<script>
// Generate wavy lines
(function() {
  var container = document.getElementById("dims-waves");
  var w = 1920, h = 1080;
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  var gap = 10;
  var totalLines = Math.ceil((w + 200) / gap);
  var totalPoints = Math.ceil((h + 40) / gap);
  var xStart = (w - gap * totalLines) / 2;
  var yStart = (h - gap * totalPoints) / 2;
  for (var i = 0; i < totalLines; i++) {
    var d = "";
    for (var j = 0; j < totalPoints; j++) {
      var bx = xStart + gap * i;
      var by = yStart + gap * j;
      var wx = Math.sin(by * 0.008 + i * 0.3) * 6 + Math.sin(by * 0.003 + i * 0.7) * 4;
      var wy = Math.cos(bx * 0.005 + j * 0.2) * 3;
      d += (j === 0 ? "M " : "L ") + (bx + wx).toFixed(1) + " " + (by + wy).toFixed(1) + " ";
    }
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#818cf8");
    path.setAttribute("stroke-width", "1");
    path.setAttribute("stroke-opacity", "0.14");
    svg.appendChild(path);
  }
  container.appendChild(svg);
})();

var tl = gsap.timeline({ paused: true });

// Background cross-fade in
tl.fromTo("#dims-bg",
  { opacity: 0 },
  { opacity: 1, duration: 0.5, ease: "power2.out" },
  0
);
tl.fromTo("#dims-waves",
  { opacity: 0 },
  { opacity: 1, duration: 0.8, ease: "power2.out" },
  0
);
tl.fromTo("#dims-glow",
  { opacity: 0, scale: 0.8 },
  { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" },
  0
);

// Label slides down
tl.fromTo("#dims-label",
  { opacity: 0, y: -15 },
  { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" },
  0.2
);

// Connection line draws left to right
tl.fromTo("#dims-connector",
  { scaleX: 0 },
  { scaleX: 1, duration: 1.8, ease: "power2.inOut" },
  0.4
);

// Cards arrive with spring overshoot
var cardTimings = [0.56, 1.09, 1.64, 2.19];
var cardIds = ["#dim-1", "#dim-2", "#dim-3", "#dim-4"];

cardIds.forEach(function(id, i) {
  tl.fromTo(id,
    { opacity: 0, y: 40, scale: 0.88, rotateX: 8 },
    { opacity: 1, y: 0, scale: 1, rotateX: 0, duration: 0.5, ease: "back.out(1.8)" },
    cardTimings[i]
  );

  var svg = document.querySelector(id + " .dim-icon svg");
  if (svg) {
    var paths = svg.querySelectorAll("circle, line, path, polyline");
    paths.forEach(function(p) {
      var len = 100;
      try { len = p.getTotalLength(); } catch(e) {}
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      tl.to(p, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, cardTimings[i] + 0.15);
    });
  }

  tl.to(id, { y: -4, duration: 0.15, ease: "power2.out" }, cardTimings[i] + 0.4);
  tl.to(id, { y: 0, duration: 0.3, ease: "power2.inOut" }, cardTimings[i] + 0.55);
});

// Tagline words stagger in
var tagWords = ["#tw1", "#tw2", "#tw3", "#tw4", "#tw5"];
tagWords.forEach(function(w, i) {
  tl.fromTo(w,
    { opacity: 0, y: 10 },
    { opacity: 1, y: 0, duration: 0.35, ease: "power4.out" },
    3.0 + i * 0.12
  );
});

// Glow breathes
tl.to("#dims-glow", { scale: 1.1, duration: 2, ease: "sine.inOut", yoyo: true }, 1);

// Exit
tl.to("#dims-content",
  { opacity: 0, y: -15, filter: "blur(3px)", duration: 0.5, ease: "power2.in" },
  4.7
);
tl.to(["#dims-glow", "#dims-bg", "#dims-waves"],
  { opacity: 0, duration: 0.5, ease: "power2.in" },
  4.7
);

window.__timelines["dimensions"] = tl;
</script>
