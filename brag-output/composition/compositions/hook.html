<script>
(function() {
  var container = document.getElementById("hook-waves");
  var w = 1920, h = 1080;
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");

  var gap = 10;
  var totalLines = Math.ceil((w + 200) / gap);
  var totalPoints = Math.ceil((h + 40) / gap);
  var xStart = (w - gap * totalLines) / 2;
  var yStart = (h - gap * totalPoints) / 2;

  for (var i = 0; i < totalLines; i++) {
    var d = "";
    for (var j = 0; j < totalPoints; j++) {
      var baseX = xStart + gap * i;
      var baseY = yStart + gap * j;
      var waveX = Math.sin(baseY * 0.008 + i * 0.3) * 6 + Math.sin(baseY * 0.003 + i * 0.7) * 4;
      var waveY = Math.cos(baseX * 0.005 + j * 0.2) * 3;
      var px = baseX + waveX;
      var py = baseY + waveY;
      d += (j === 0 ? "M " : "L ") + px.toFixed(1) + " " + py.toFixed(1) + " ";
    }
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#818cf8");
    path.setAttribute("stroke-width", "1");
    path.setAttribute("stroke-opacity", "0.14");
    svg.appendChild(path);
  }

})();
