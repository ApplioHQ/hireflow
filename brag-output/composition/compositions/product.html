<script>
// Generate wavy lines
(function() {
  var container = document.getElementById("prod-waves");
  var w = 1920, h = 1080;
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  var gap = 10;
  var totalLines = Math.ceil((w + 200) / gap);
  var totalPoints = Math.ceil((h + 40) / gap);
  var xStart = (w - gap * totalLines) / 2;
  var yStart = (h - gap * totalPoints) / 2;
  for (var i = 0; i < totalLines; i++) {
    var d = "";
    for (var j = 0; j < totalPoints; j++) {
      var bx = xStart + gap * i;
      var by = yStart + gap * j;
      var wx = Math.sin(by * 0.008 + i * 0.3) * 6 + Math.sin(by * 0.003 + i * 0.7) * 4;
      var wy = Math.cos(bx * 0.005 + j * 0.2) * 3;
      d += (j === 0 ? "M " : "L ") + (bx + wx).toFixed(1) + " " + (by + wy).toFixed(1) + " ";
    }
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#818cf8");
    path.setAttribute("stroke-width", "1");
    path.setAttribute("stroke-opacity", "0.14");
    svg.appendChild(path);
  }
  container.appendChild(svg);
})();

var tl = gsap.timeline({ paused: true });

// Cross-fade in
tl.fromTo("#prod-bg", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
tl.fromTo("#prod-waves", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);
tl.fromTo("#prod-glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.5, ease: "power2.out" }, 0);

// Hide elements initially
tl.set("#product-stamp", { opacity: 0 }, 0);
tl.set("#ats-ring-wrap", { opacity: 0 }, 0);
tl.set("#ats-ring-tag", { opacity: 0 }, 0);
tl.set("#ats-ring-glow", { opacity: 0 }, 0);
tl.set("#suggestion-bar", { opacity: 0, xPercent: -50 }, 0);
tl.set("#ats-ring-benchmark", { opacity: 0 }, 0);

// Card enters with 3D perspective tilt
tl.fromTo("#product-card",
  { opacity: 0, rotateY: 8, rotateX: -4, scale: 0.92, filter: "blur(6px)" },
  { opacity: 1, rotateY: 0, rotateX: 0, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "power4.out" },
  0.3
);

// Bullets stagger in
tl.fromTo("#bullet-1", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power4.out" }, 0.9);
tl.fromTo("#bullet-2", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power4.out" }, 1.1);
tl.fromTo("#bullet-3", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power4.out" }, 1.3);

// Skills pop in with spring
var skills = ["#skill-1","#skill-2","#skill-3","#skill-4","#skill-5","#skill-6"];
skills.forEach(function(s, i) {
  tl.fromTo(s,
    { opacity: 0, scale: 0.7 },
    { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" },
    1.5 + i * 0.08
  );
});

// ATS ring appears
tl.fromTo("#ats-ring-wrap",
  { opacity: 0, scale: 0.85, x: -20 },
  { opacity: 1, scale: 1, x: 0, duration: 0.5, ease: "back.out(1.4)" },
  2.0
);

// Phase 1: Ring fills to 84 (before suggestion)
var offset84 = 301.6 * (1 - 84/100);
var offset96 = 301.6 * (1 - 96/100);
tl.fromTo("#ats-ring-fill",
  { attr: { "stroke-dashoffset": 301.6 } },
  { attr: { "stroke-dashoffset": offset84 }, duration: 1.4, ease: "power2.out" },
  2.2
);
tl.fromTo("#ats-ring-glow",
  { opacity: 0 },
  { opacity: 0.6, duration: 1.2, ease: "power2.out" },
  2.5
);

// Counter 0 -> 84
tl.fromTo("#ats-ring-num",
  { textContent: "0" },
  {
    textContent: "84",
    duration: 1.4,
    ease: "power3.out",
    snap: { textContent: 1 },
    onUpdate: function() {
      var el = document.querySelector("#ats-ring-num");
      if (el) el.textContent = Math.round(parseFloat(el.textContent));
    }
  },
  2.2
);

// Highlight bullet-1 when suggestion references it
tl.to("#bullet-1",
  { color: "#e6e9f5", duration: 0.25, ease: "power2.out" },
  3.0
);

// Suggestion bar slides up
tl.fromTo("#suggestion-bar",
  { opacity: 0, y: 20, xPercent: -50 },
  { opacity: 1, y: 0, xPercent: -50, duration: 0.4, ease: "back.out(1.4)" },
  3.2
);

// Phase 2: Score bumps 84 -> 96 after suggestion
tl.fromTo("#ats-ring-fill",
  { attr: { "stroke-dashoffset": offset84 } },
  { attr: { "stroke-dashoffset": offset96 }, duration: 0.8, ease: "power2.out" },
  3.6
);
tl.fromTo("#ats-ring-num",
  { textContent: "84" },
  {
    textContent: "96",
    duration: 0.8,
    ease: "power2.out",
    snap: { textContent: 1 },
    onUpdate: function() {
      var el = document.querySelector("#ats-ring-num");
      if (el) el.textContent = Math.round(parseFloat(el.textContent));
    }
  },
  3.6
);

// Ring glow pulse on score bump
tl.to("#ats-ring-glow",
  { opacity: 1, scale: 1.3, duration: 0.5, ease: "power2.out" },
  3.6
);
tl.to("#ats-ring-glow",
  { scale: 1, duration: 0.4, ease: "power2.inOut" },
  4.1
);

// Suggestion bar fades out after score lands
tl.to("#suggestion-bar",
  { opacity: 0, y: -6, xPercent: -50, duration: 0.3, ease: "power2.in" },
  4.5
);

// Reset bullet highlight
tl.to("#bullet-1",
  { color: "#c8cad4", duration: 0.3, ease: "power2.inOut" },
  4.5
);

// Stamp appears
tl.fromTo("#product-stamp",
  { opacity: 0, y: -10, scale: 0.9 },
  { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2)" },
  4.4
);

// "Excellent" tag
tl.fromTo("#ats-ring-tag",
  { opacity: 0, y: 6 },
  { opacity: 1, y: 0, duration: 0.3, ease: "power4.out" },
  4.6
);

// Benchmark text
tl.fromTo("#ats-ring-benchmark",
  { opacity: 0, y: 4 },
  { opacity: 1, y: 0, duration: 0.3, ease: "power4.out" },
  4.8
);

// Exit
tl.to("#product-perspective",
  { opacity: 0, scale: 0.96, filter: "blur(4px)", duration: 0.5, ease: "power2.in" },
  5.8
);
tl.to(["#prod-glow", "#prod-bg", "#prod-waves"],
  { opacity: 0, duration: 0.5, ease: "power2.in" },
  5.8
);

window.__timelines["product"] = tl;
</script>
