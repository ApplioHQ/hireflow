<script>
// Generate wavy lines
(function() {
  var container = document.getElementById("punch-waves");
  var w = 1920, h = 1080;
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  var gap = 10;
  var totalLines = Math.ceil((w + 200) / gap);
  var totalPoints = Math.ceil((h + 40) / gap);
  var xStart = (w - gap * totalLines) / 2;
  var yStart = (h - gap * totalPoints) / 2;
  for (var i = 0; i < totalLines; i++) {
    var d = "";
    for (var j = 0; j < totalPoints; j++) {
      var bx = xStart + gap * i;
      var by = yStart + gap * j;
      var wx = Math.sin(by * 0.008 + i * 0.3) * 6 + Math.sin(by * 0.003 + i * 0.7) * 4;
      var wy = Math.cos(bx * 0.005 + j * 0.2) * 3;
      d += (j === 0 ? "M " : "L ") + (bx + wx).toFixed(1) + " " + (by + wy).toFixed(1) + " ";
    }
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#818cf8");
    path.setAttribute("stroke-width", "1");
    path.setAttribute("stroke-opacity", "0.14");
    svg.appendChild(path);
  }
  container.appendChild(svg);
})();

var tl = gsap.timeline({ paused: true });

// Score badge initial state -- positioned above headline
gsap.set("#punch-score-badge", { xPercent: -50, yPercent: -50, y: -140, opacity: 0 });

// Background fades in
tl.fromTo("#punch-bg",
  { opacity: 0 },
  { opacity: 1, duration: 0.5, ease: "power2.out" },
  0
);
tl.fromTo("#punch-waves",
  { opacity: 0 },
  { opacity: 1, duration: 0.8, ease: "power2.out" },
  0
);

// Glow blooms
tl.fromTo("#punch-glow",
  { opacity: 0, scale: 0.6 },
  { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" },
  0
);

// Letterbox bars slide in
tl.fromTo("#letterbox-top",
  { y: -50 },
  { y: 0, duration: 0.6, ease: "power4.out" },
  0.1
);
tl.fromTo("#letterbox-bottom",
  { y: 50 },
  { y: 0, duration: 0.6, ease: "power4.out" },
  0.1
);

// Particles float
var pParticles = document.querySelectorAll(".punch-particle");
pParticles.forEach(function(p, i) {
  tl.fromTo(p,
    { opacity: 0, y: 20 },
    { opacity: 1, y: -30, duration: 5, ease: "none" },
    0.15 * i
  );
});

// Score badge fades in from above
tl.to("#punch-score-badge",
  { opacity: 1, y: -160, xPercent: -50, yPercent: -50, duration: 0.4, ease: "back.out(1.5)" },
  0.3
);
// Subtle pulse
tl.to("#punch-score-badge",
  { scale: 1.05, duration: 0.2, ease: "power2.out" },
  0.7
);
tl.to("#punch-score-badge",
  { scale: 1, duration: 0.3, ease: "power2.inOut" },
  0.9
);

// "Free forever." characters slam in
var chars = document.querySelectorAll(".punch-char");
tl.fromTo(chars,
  { opacity: 0, y: 40, scale: 1.1, filter: "blur(6px)" },
  { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "back.out(1.5)", stagger: 0.03 },
  0.5
);

// Text glow pulse after text lands
tl.fromTo("#punch-text-glow",
  { opacity: 0, scale: 0.8 },
  { opacity: 1, scale: 1.2, duration: 0.4, ease: "power2.out" },
  1.0
);
tl.to("#punch-text-glow",
  { opacity: 0.6, scale: 1, duration: 0.6, ease: "power2.inOut" },
  1.4
);

// Supporting line
tl.fromTo("#punch-sub",
  { opacity: 0, y: 12 },
  { opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
  1.5
);

// URL enters
tl.fromTo("#punch-url",
  { opacity: 0, y: 10 },
  { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" },
  2.2
);

// Underline draws in
tl.fromTo("#punch-underline",
  { width: "0%" },
  { width: "100%", duration: 0.5, ease: "power2.inOut" },
  2.5
);

// Glow breathes gently
tl.to("#punch-glow",
  { scale: 1.1, duration: 2.5, ease: "sine.inOut", yoyo: true },
  1
);

window.__timelines["punchline"] = tl;
</script>
