<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#111113"},
    {"id":"color-ink","type":"color","label":"Text","default":"#e6e9f5"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#6d4dfc"},
    {"id":"font-display","type":"string","label":"Display font","default":"Sora"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 400;
        src: url('assets/fonts/sora-400.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 500;
        src: url('assets/fonts/sora-500.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 600;
        src: url('assets/fonts/sora-600.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Sora';
        font-style: normal;
        font-weight: 700;
        src: url('assets/fonts/sora-700.ttf') format('truetype');
      }
      :root {
        --color-ground: #111113;
        --color-ink: #e6e9f5;
        --color-accent: #6d4dfc;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: 'Sora', sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: Hook -->
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 2: Product -->
      <div
        id="product"
        data-composition-id="product"
        data-composition-src="compositions/product.html"
        data-start="3.8"
        data-duration="6.7"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 3: Dimensions -->
      <div
        id="dimensions"
        data-composition-id="dimensions"
        data-composition-src="compositions/dimensions.html"
        data-start="9.5"
        data-duration="5.5"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 4: Punchline -->
      <div
        id="punchline"
        data-composition-id="punchline"
        data-composition-src="compositions/punchline.html"
        data-start="14.5"
        data-duration="5.5"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Music bed -->
      <audio
        id="bg-music"
        data-start="0"
        data-duration="20"
        data-track-index="10"
        data-volume="0.30"
        data-fade-in="0.5"
        data-fade-out="1.5"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"
      ></audio>

      <!-- SFX: ATS score reveal (Scene 2) -->
      <audio
        id="sfx-score"
        data-start="6.2"
        data-duration="1.5"
        data-track-index="11"
        data-volume="0.50"
        src="assets/sfx/impact/impactBell_heavy_000.ogg"
      ></audio>

      <!-- SFX: Keyword chips appear (Scene 2) -->
      <audio
        id="sfx-card-1"
        data-start="7.6"
        data-duration="0.11"
        data-track-index="12"
        data-volume="0.45"
        src="assets/sfx/interface/drop_001.ogg"
      ></audio>

      <!-- SFX: Tailor score jump (Scene 3) -->
      <audio
        id="sfx-tailor"
        data-start="12.8"
        data-duration="1.5"
        data-track-index="13"
        data-volume="0.45"
        src="assets/sfx/impact/impactBell_heavy_000.ogg"
      ></audio>

      <!-- SFX: Apply All click (Scene 3) -->
      <audio
        id="sfx-card-4"
        data-start="14.1"
        data-duration="0.19"
        data-track-index="15"
        data-volume="0.45"
        src="assets/sfx/interface/drop_002.ogg"
      ></audio>

      <!-- SFX: Punchline bell -->
      <audio
        id="sfx-punch"
        data-start="15.4"
        data-duration="1.5"
        data-track-index="14"
        data-volume="0.50"
        src="assets/sfx/impact/impactBell_heavy_000.ogg"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
