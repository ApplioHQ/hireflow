<!doctype html>
<html lang="en"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post-export testimonial mockup</title><link rel="stylesheet" href="css/testimonial-flows.css"></head>
<body><header class="topbar"><div class="brand"><span class="brand-mark">A</span>Applio</div><span class="topbar-note">Post-export mockup</span></header><main class="modal-stage"><section class="modal"><div class="modal-top"><span class="score">92</span><button class="close" id="skip" aria-label="Close">×</button></div><p class="eyebrow" style="margin-top:18px">Your resume is ready</p><h2>Enjoying Applio so far?</h2><p class="lead" style="font-size:15px;margin-bottom:18px">A one-line note helps other job seekers decide whether to try it. This is entirely optional.</p><div class="field"><label for="quote">What has been useful?</label><textarea id="quote" placeholder="e.g. The ATS checker showed me exactly what to improve."></textarea></div><label class="check"><input id="publish" type="checkbox"><span><strong>It is okay to publish this testimonial.</strong><br>We will show your role and company only if you add them and review the final quote with you first.</span></label><div class="actions"><button id="send" class="btn btn-primary">Share feedback</button><button class="btn btn-secondary" id="later">Maybe later</button></div><p class="success" id="sent">Thanks. Your feedback is saved for review, not published automatically.</p></section></main><script>const done=()=>document.getElementById('sent').classList.add('visible');document.getElementById('send').onclick=done;document.getElementById('later').onclick=done;document.getElementById('skip').onclick=done;</script></body></html>
