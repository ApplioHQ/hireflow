<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Applio</title>
<meta name="theme-color" content="#5b54e8">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%}
  body{
    background:#07091a;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,Inter,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  }
  .wrap{max-width:360px}
  .logo{width:72px;height:72px;border-radius:18px;background:#fff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:22px}
  .logo img{width:52px;height:52px}
  h1{font-size:22px;font-weight:600;margin:0 0 10px}
  p{font-size:15px;line-height:1.6;color:rgba(255,255,255,.6);margin:0 0 22px}
  button{
    background:#5b54e8;color:#fff;border:none;border-radius:12px;
    padding:13px 26px;font-size:15px;font-weight:500;cursor:pointer
  }
  button:active{transform:scale(.98)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="/icon-512.png" alt="Applio"></div>
    <h1>You're offline</h1>
    <p>Applio needs a connection to load this page. Your work is safe. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
