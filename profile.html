<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Your Profile | Applio</title>
<link rel="icon" href="logo.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Applio">
<link rel="stylesheet" href="css/styles.css">
<script src="js/theme.js"></script>
<style>
  .pf-wrap { max-width: 560px; margin: 0 auto; padding: 32px 20px 90px; }
  .pf-wrap h1 { font-size: clamp(24px,4vw,30px); font-weight: 800; letter-spacing:-.4px; }
  .pf-sub { color: var(--muted); font-size: 14px; margin-top: 6px; line-height:1.55; }
  .pf-card { margin-top: 22px; padding: 22px; }
  .pf-avatar-row { display:flex; align-items:center; gap:18px; padding: 4px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .pf-avatar { position:relative; width:76px; height:76px; flex:none; }
  .pf-avatar-circle { width:76px; height:76px; border-radius:50%; background: linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; overflow:hidden; }
  .pf-avatar-circle img { width:100%; height:100%; object-fit:cover; }
  .pf-cam { position:absolute; bottom:-2px; right:-2px; width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; border:2px solid var(--bg-1); cursor:pointer; }
  .pf-cam svg { width:15px; height:15px; }
  .pf-avatar-actions { display:flex; gap:8px; margin-bottom:6px; }
  .pf-hint { font-size: 11.5px; color: var(--muted); }
  .pf-field { margin-bottom: 16px; }
  .pf-field label { display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px; }
  .pf-field input { width:100%; box-sizing:border-box; padding:11px 13px; background:var(--bg-2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:14.5px; font-family:inherit; transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .pf-field input:focus { outline:none; border-color:var(--accent); box-shadow:var(--ring); }
  .pf-email { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg-1); border:1px solid var(--border); border-radius:10px; padding:11px 13px; }
  .pf-email span.e { font-size:14px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pf-email span.lk { font-size:11.5px; color:var(--muted); display:inline-flex; align-items:center; gap:4px; flex-shrink:0; }
  .pf-toggle-row { display:flex; align-items:center; gap:10px; margin:16px 0 4px; font-size:13.5px; color:var(--text); cursor:pointer; }
  .pf-toggle-row input { width:16px; height:16px; accent-color:var(--accent); flex-shrink:0; }
  .pf-actions { display:flex; gap:10px; justify-content:flex-end; align-items:center; margin-top:22px; padding-top:18px; border-top:1px solid var(--border); }
  .pf-status { font-size:13px; color:var(--muted); margin-right:auto; }
  .pf-status.ok { color:var(--success,#22c55e); }
  .pf-status.err { color:var(--danger,#ef4444); }
</style>
</head>
<body class="app-body-scroll">
<header class="app-topbar">
  <a href="/dashboard" class="brand"><img src="logo.jpeg" width="32" height="32" class="brand-logo" alt="Applio"><span>Applio</span></a>
  <div class="topbar-right">
    <button class="theme-toggle" onclick="toggleTheme()">☀️ Light</button>
    <a class="btn btn-ghost btn-sm" href="/editor">Back to editor</a>
  </div>
</header>

<main class="pf-wrap">
  <h1>Your profile</h1>
  <p class="pf-sub">Add a photo and a few details. Your name and photo show up around Applio, and can carry onto new resumes.</p>

  <div class="section-card pf-card">
    <div class="pf-avatar-row">
      <div class="pf-avatar">
        <div class="pf-avatar-circle" id="pf-avatar"><span id="pf-initial">A</span></div>
        <label class="pf-cam" for="pf-file" title="Upload a photo" aria-label="Upload a photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </label>
        <input type="file" id="pf-file" accept="image/png,image/jpeg,image/webp" hidden>
      </div>
      <div>
        <div class="pf-avatar-actions">
          <button class="btn btn-secondary btn-sm" type="button" id="pf-upload">Upload photo</button>
          <button class="btn btn-ghost btn-sm" type="button" id="pf-remove" style="display:none;">Remove</button>
        </div>
        <div class="pf-hint">JPG, PNG, or WebP, up to 5 MB. Square works best.</div>
      </div>
    </div>

    <div class="pf-field">
      <label for="pf-name">Display name</label>
      <input type="text" id="pf-name" maxlength="80" placeholder="Your name" autocomplete="name">
    </div>
    <div class="pf-field">
      <label for="pf-headline">Professional headline</label>
      <input type="text" id="pf-headline" maxlength="120" placeholder="e.g. Registered nurse, 6 years">
    </div>
    <div class="pf-field">
      <label for="pf-location">Location <span style="color:var(--muted);font-weight:400;">(optional)</span></label>
      <input type="text" id="pf-location" maxlength="120" placeholder="City, State">
    </div>
    <div class="pf-field" style="margin-bottom:4px;">
      <label>Email</label>
      <div class="pf-email">
        <span class="e" id="pf-email">—</span>
        <span class="lk"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Used to sign in</span>
      </div>
    </div>

    <label class="pf-toggle-row">
      <input type="checkbox" id="pf-onresume" checked>
      Use this name and headline on new resumes
    </label>

    <div class="pf-actions">
      <span class="pf-status" id="pf-status"></span>
      <a class="btn btn-ghost" href="/editor">Cancel</a>
      <button class="btn btn-primary" id="pf-save">Save changes</button>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/notify.js"></script>
<script>
(function () {
  var API = window.HIREFLOW_CONFIG.API_URL;
  var TOKEN = localStorage.getItem('hf_token');
  if (!TOKEN) { location.href = 'login'; return; }

  var PROFILE = {};         // full profile object (preserve unknown fields on save)
  var avatarData = null;    // current avatar data URL (or null)
  var EMAIL = localStorage.getItem('hf_email') || '';

  var el = function (id) { return document.getElementById(id); };
  function setStatus(msg, cls) { var s = el('pf-status'); s.textContent = msg || ''; s.className = 'pf-status' + (cls ? ' ' + cls : ''); }

  function initial() { return (EMAIL || 'A').trim().charAt(0).toUpperCase(); }
  function renderAvatar() {
    var box = el('pf-avatar');
    if (avatarData) {
      box.innerHTML = '<img src="' + avatarData + '" alt="Profile photo">';
      el('pf-remove').style.display = '';
    } else {
      box.innerHTML = '<span id="pf-initial">' + initial() + '</span>';
      el('pf-remove').style.display = 'none';
    }
  }

  // Resize an uploaded image to a 256px square JPEG data URL (keeps the payload tiny).
  function resizeToDataURL(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var S = 256;
        var c = document.createElement('canvas'); c.width = S; c.height = S;
        var ctx = c.getContext('2d');
        var side = Math.min(img.width, img.height);
        var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, S, S);
        cb(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function () { cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function () { cb(null); };
    reader.readAsDataURL(file);
  }

  function onFile(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { notify({ title: 'Image too large', body: 'Please pick an image under 5 MB.' }); return; }
    resizeToDataURL(file, function (url) {
      if (!url) { notify({ title: "Couldn't read that image", body: 'Try a different JPG or PNG.' }); return; }
      avatarData = url; renderAvatar(); setStatus('');
    });
  }

  el('pf-file').addEventListener('change', function (e) { onFile(e.target.files && e.target.files[0]); e.target.value = ''; });
  el('pf-upload').addEventListener('click', function () { el('pf-file').click(); });
  el('pf-remove').addEventListener('click', function () { avatarData = null; renderAvatar(); });

  async function load() {
    el('pf-email').textContent = EMAIL || 'Account';
    try {
      var r = await fetch(API + '/profile', { headers: { Authorization: 'Bearer ' + TOKEN } });
      if (r.status === 401 || r.status === 403) { location.href = 'login'; return; }
      var d = await r.json();
      PROFILE = (d && d.profile && typeof d.profile === 'object') ? d.profile : {};
    } catch (e) { PROFILE = {}; }
    el('pf-name').value = PROFILE.displayName || '';
    el('pf-headline').value = PROFILE.headline || '';
    el('pf-location').value = PROFILE.location || '';
    el('pf-onresume').checked = PROFILE.useOnResume !== false;
    avatarData = PROFILE.avatar || null;
    renderAvatar();
  }

  async function save() {
    var btn = el('pf-save');
    btn.disabled = true; setStatus('Saving…');
    PROFILE.displayName = el('pf-name').value.trim().slice(0, 80);
    PROFILE.headline = el('pf-headline').value.trim().slice(0, 120);
    PROFILE.location = el('pf-location').value.trim().slice(0, 120);
    PROFILE.useOnResume = el('pf-onresume').checked;
    if (avatarData) PROFILE.avatar = avatarData; else delete PROFILE.avatar;
    try {
      var r = await fetch(API + '/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
        body: JSON.stringify({ profile: PROFILE })
      });
      if (r.status === 413) { setStatus('That photo is too large, try a smaller one.', 'err'); btn.disabled = false; return; }
      if (!r.ok) throw new Error('save failed');
      // Cache for fast avatar rendering elsewhere (topbar reads this).
      try { localStorage.setItem('hf_profile', JSON.stringify(PROFILE)); } catch (e) {}
      setStatus('Saved ✓', 'ok');
      setTimeout(function () { if (el('pf-status').textContent === 'Saved ✓') setStatus(''); }, 3000);
    } catch (e) {
      setStatus("Couldn't save, please try again.", 'err');
    } finally { btn.disabled = false; }
  }

  el('pf-save').addEventListener('click', save);
  load();
})();
</script>
<script src="js/footer.js"></script>
</body>
</html>
