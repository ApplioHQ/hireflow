<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Salary Insights | Applio</title>
<link rel="icon" href="logo.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
  .sw-wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---- Header ---- */
  .sw-hero { text-align: center; margin-bottom: 24px; }
  .sw-hero h1 { font-size: clamp(22px, 4vw, 30px); font-weight: 800; letter-spacing: -.5px; display: inline-flex; align-items: center; gap: 10px; }
  .sw-hero p { color: var(--muted); font-size: 14px; margin-top: 6px; max-width: 480px; margin-left: auto; margin-right: auto; }

  /* ---- Inline form ---- */
  .sw-form-row { display: flex; gap: 10px; align-items: flex-end; }
  @media (max-width: 640px) { .sw-form-row { flex-direction: column; align-items: stretch; } }
  .sw-field { flex: 1; }
  .sw-field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
  .sw-field input { width: 100%; box-sizing: border-box; padding: 10px 14px; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-md); color: var(--text); font-size: 14px; font-family: inherit; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .sw-field input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
  .sw-go { flex-shrink: 0; height: 42px; padding: 0 22px; white-space: nowrap; }

  /* Seniority chips */
  .sw-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 14px 0 20px; }
  .sw-chip { font-size: 12.5px; padding: 6px 14px; border-radius: var(--r-full); border: 1px solid var(--border); background: var(--bg-1); color: var(--text); cursor: pointer; transition: all var(--dur) var(--ease); }
  .sw-chip:hover { border-color: var(--accent); color: var(--accent); }
  .sw-chip.active { border-color: transparent; color: var(--on-accent); background: var(--accent); }

  /* ---- Empty state ---- */
  .sw-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 60px 20px; }
  .sw-empty svg { width: 48px; height: 48px; color: var(--accent); margin-bottom: 16px; opacity: .85; }
  .sw-empty h4 { color: var(--text); font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .sw-empty p { font-size: 13.5px; max-width: 380px; line-height: 1.6; }
  .sw-steps { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; text-align: left; max-width: 340px; width: 100%; }
  .sw-step { display: flex; gap: 11px; align-items: flex-start; }
  .sw-step-n { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-ghost); border: 1px solid var(--accent-line); color: var(--accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .sw-step-t { font-size: 13px; font-weight: 650; color: var(--text); }
  .sw-step-d { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 2px; }

  /* ---- Skeleton ---- */
  .sw-skel { display: flex; flex-direction: column; gap: 14px; padding: 4px 2px; }
  .sw-skel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
  .sw-skel-head-l { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .sw-sk { display: block; background: linear-gradient(90deg, var(--bg-2) 0%, rgba(255,255,255,.06) 50%, var(--bg-2) 100%); background-size: 200% 100%; border-radius: 6px; animation: swShimmer 1.35s linear infinite; }
  .sw-sk-lg { height: 42px; width: 55%; border-radius: 10px; }
  .sw-sk-title { height: 18px; width: 50%; }
  .sw-sk-sub { height: 12px; width: 35%; }
  .sw-sk-pill { height: 22px; width: 120px; border-radius: 999px; }
  .sw-sk-bar { height: 12px; width: 100%; border-radius: 999px; margin-top: 6px; }
  .sw-sk-legend { display: flex; gap: 40px; }
  .sw-sk-legend .sw-sk { height: 10px; width: 50px; }
  .sw-sk-section { height: 13px; width: 40%; margin-top: 10px; }
  .sw-sk-line { height: 12px; }
  .sw-sk-line.w95 { width: 95%; } .sw-sk-line.w85 { width: 85%; }
  .sw-sk-line.w80 { width: 80%; } .sw-sk-line.w70 { width: 70%; }
  .sw-sk-block { height: 62px; width: 100%; border-radius: 10px; margin-top: 6px; }
  @keyframes swShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sw-sk { animation: none; background: var(--bg-2); } }

  /* ---- Result card ---- */
  .sw-result { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 24px; animation: swFadeUp .4s var(--ease-out) both; }
  @keyframes swFadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .sw-result { animation: none; } }

  .sw-res-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .sw-res-role { font-size: 18px; font-weight: 800; }
  .sw-res-loc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .sw-res-meta { margin-top: 6px; }
  .sw-conf { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px; border-radius: var(--r-full); }
  .sw-conf.high { color: var(--success-text); background: var(--success-soft); }
  .sw-conf.medium { color: var(--warning-text); background: var(--warning-soft); }
  .sw-conf.low { color: var(--danger-text); background: var(--danger-soft); }
  .sw-src { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 10px; border-radius: var(--r-full); }
  .sw-src-live { color: var(--success-text); background: var(--success-soft); }
  .sw-src-est { color: var(--accent-text); background: var(--accent-soft); }

  /* Big number */
  .sw-median { font-size: 38px; font-weight: 800; letter-spacing: -.5px; margin: 14px 0 2px; }
  .sw-median small { font-size: 15px; font-weight: 600; color: var(--muted); }
  .sw-range-lbl { font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  /* ---- Interactive range bar ---- */
  .sw-range-bar { position: relative; height: 48px; margin: 20px 0 12px; cursor: crosshair; }
  .sw-range-track { position: absolute; top: 50%; left: 0; right: 0; height: 10px; border-radius: 5px; background: var(--bg-2); transform: translateY(-50%); }
  .sw-range-fill { position: absolute; top: 50%; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--accent-deep), var(--accent-2)); transform: translateY(-50%); transition: left .5s var(--ease-out), width .5s var(--ease-out); }
  .sw-range-thumb { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg-1); box-shadow: var(--sh-1); transform: translate(-50%, -50%); transition: left .5s var(--ease-out); pointer-events: none; }
  .sw-range-tooltip { position: absolute; top: -32px; transform: translateX(-50%); background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; box-shadow: var(--sh-1); z-index: 2; }
  .sw-range-tooltip::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--border); }
  .sw-range-bar:hover .sw-range-tooltip { opacity: 1; }
  .sw-range-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 16px; }

  /* ---- Section headers ---- */
  .sw-section-t { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
  .sw-section-t svg { width: 14px; height: 14px; color: var(--accent); }

  /* ---- Tabs ---- */
  .sw-tabs { display: flex; gap: 0; margin: 24px 0 16px; border-bottom: 1px solid var(--border); }
  .sw-tab { padding: 10px 18px; font-size: 13px; font-weight: 600; color: var(--muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease); }
  .sw-tab:hover { color: var(--text); }
  .sw-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .sw-tab-panel { display: none; }
  .sw-tab-panel.active { display: block; animation: swFadeUp .25s var(--ease-out) both; }

  /* ---- Percentile cards ---- */
  .sw-percentile-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  @media (max-width: 640px) { .sw-percentile-grid { grid-template-columns: repeat(3, 1fr); } }
  .sw-percentile-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 8px; text-align: center; cursor: pointer; transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease); }
  .sw-percentile-card:hover { transform: translateY(-3px); box-shadow: var(--sh-1); border-color: var(--accent-line); }
  .sw-percentile-card.active { border-color: var(--accent); background: var(--accent-ghost); }
  .sw-percentile-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .sw-percentile-value { font-size: 17px; font-weight: 800; color: var(--text); line-height: 1; }
  .sw-percentile-card.active .sw-percentile-value { color: var(--accent); }

  /* ---- Comp breakdown ---- */
  .sw-comp-breakdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 640px) { .sw-comp-breakdown { grid-template-columns: 1fr; } }
  .sw-comp-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px; text-align: center; transition: transform var(--dur) var(--ease); }
  .sw-comp-card:hover { transform: translateY(-2px); }
  .sw-comp-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .sw-comp-value { font-size: 22px; font-weight: 800; line-height: 1; }
  .sw-comp-pct { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .sw-comp-card.base .sw-comp-value { color: var(--accent); }
  .sw-comp-card.bonus .sw-comp-value { color: var(--warning-text); }
  .sw-comp-card.equity .sw-comp-value { color: var(--success-text); }
  .sw-comp-total { text-align: right; margin-top: 10px; font-size: 14px; font-weight: 700; }

  /* ---- Offer calc (live) ---- */
  .sw-offer-calc { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 18px; }
  .sw-offer-calc h4 { font-size: 14px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .sw-offer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  @media (max-width: 480px) { .sw-offer-row { grid-template-columns: 1fr; } }
  .sw-offer-field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .sw-offer-field input { width: 100%; box-sizing: border-box; padding: 10px 12px; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text); font-size: 14px; font-family: inherit; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .sw-offer-field input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
  .sw-offer-result { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); transition: opacity .2s; }
  .sw-offer-meter { height: 8px; border-radius: 4px; background: var(--bg-3); margin: 10px 0 6px; overflow: hidden; }
  .sw-offer-meter-fill { height: 100%; border-radius: 4px; transition: width .4s var(--ease-out), background .3s; }
  .sw-offer-verdict { font-size: 14px; font-weight: 700; }
  .sw-offer-verdict.good { color: var(--success-text); }
  .sw-offer-verdict.fair { color: var(--warning-text); }
  .sw-offer-verdict.low { color: var(--danger-text); }
  .sw-offer-detail { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ---- Level cards ---- */
  .sw-level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 640px) { .sw-level-grid { grid-template-columns: repeat(2, 1fr); } }
  .sw-level-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; cursor: pointer; transition: all var(--dur) var(--ease); text-align: center; }
  .sw-level-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--sh-1); }
  .sw-level-card.selected { border-color: var(--accent); background: var(--accent-ghost); }
  .sw-level-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .sw-level-median { font-size: 18px; font-weight: 800; color: var(--text); }
  .sw-level-card.selected .sw-level-median { color: var(--accent); }
  .sw-level-range { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ---- Location cards ---- */
  .sw-loc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .sw-loc-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px; cursor: pointer; transition: all var(--dur) var(--ease); }
  .sw-loc-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--sh-1); }
  .sw-loc-card.selected { border-color: var(--accent); background: var(--accent-ghost); }
  .sw-loc-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .sw-loc-median { font-size: 16px; font-weight: 800; color: var(--accent); }
  .sw-loc-range { font-size: 10px; color: var(--muted); }
  .sw-loc-diff { font-size: 10px; font-weight: 700; margin-top: 3px; }
  .sw-loc-diff.up { color: var(--success-text); }
  .sw-loc-diff.down { color: var(--danger-text); }

  /* ---- Remote + trend ---- */
  .sw-insights-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  @media (max-width: 640px) { .sw-insights-row { grid-template-columns: 1fr; } }
  .sw-insight-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; display: flex; align-items: center; gap: 14px; }
  .sw-insight-icon { width: 40px; height: 40px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sw-insight-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .sw-insight-value { font-size: 12px; color: var(--muted); }
  .sw-insight-value strong { font-weight: 700; }

  /* ---- Factors & nego ---- */
  .sw-factors { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .sw-factors li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.5; }
  .sw-factors li svg { flex-shrink: 0; width: 16px; height: 16px; color: var(--accent); margin-top: 3px; }
  .sw-nego { background: var(--bg-2); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--r-sm); padding: 14px 16px; font-size: 13.5px; line-height: 1.55; }
  .sw-nego strong { color: var(--text); }
  .sw-disclaimer { margin-top: 20px; font-size: 11.5px; color: var(--muted); line-height: 1.5; display: flex; gap: 8px; align-items: flex-start; }
  .sw-disclaimer svg { flex-shrink: 0; width: 15px; height: 15px; margin-top: 1px; opacity: .7; }

  .sw-gate { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 44px 30px; }
  .sw-gate .badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--r-full); padding: 5px 12px; margin-bottom: 16px; }
  .sw-gate h4 { font-size: 19px; font-weight: 800; margin-bottom: 8px; }
  .sw-gate p { color: var(--muted); font-size: 14px; max-width: 380px; line-height: 1.6; margin-bottom: 18px; }
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111113">

<body class="app-body-scroll">
<header class="app-topbar">
  <div class="brand"><img src="logo.jpeg" width="32" height="32" class="brand-logo" alt="Applio"><span>Applio</span></div>
  <div class="topbar-right">
    <span id="health-badge"></span>
    <span id="plan-pill"></span>
    <button class="theme-toggle" onclick="toggleTheme()"></button>
    <button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button>
  </div>
</header>

<main class="sw-wrap">
  <div class="sw-hero">
    <h1 id="sw-title"></h1>
    <p>See what a role pays so you know which opportunities are worth your time.</p>
  </div>

  <!-- Inline form -->
  <div class="sw-form-row">
    <div class="sw-field" style="flex:2;">
      <label for="sw-role">Job title</label>
      <input id="sw-role" placeholder="e.g. Product Manager" autocomplete="off">
    </div>
    <div class="sw-field">
      <label for="sw-location">Location <span style="font-weight:400; color:var(--muted);">(optional)</span></label>
      <input id="sw-location" placeholder="e.g. Austin, TX" autocomplete="off">
    </div>
    <button class="btn btn-primary sw-go" id="sw-go"></button>
  </div>

  <div class="sw-chips" id="sw-levels">
    <button type="button" class="sw-chip active" data-level="">Auto</button>
    <button type="button" class="sw-chip" data-level="Entry">Entry</button>
    <button type="button" class="sw-chip" data-level="Mid">Mid</button>
    <button type="button" class="sw-chip" data-level="Senior">Senior</button>
    <button type="button" class="sw-chip" data-level="Lead / Staff">Lead</button>
  </div>

  <!-- Output -->
  <div id="sw-body"></div>
</main>

<script src="js/icons.js"></script>
<script src="js/notify.js"></script>

<script>
var API = window.HIREFLOW_CONFIG.API_URL;
var TOKEN = localStorage.getItem('hf_token');
function _track(name,meta){if(!TOKEN)return;fetch(API+'/track',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify({name,meta})}).catch(function(){});}
var IS_ANON = !TOKEN; if (IS_ANON) window.addEventListener('load', initAnonTopbar);
var level = '';
var _lastData = null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);});}
function signOut(){ localStorage.removeItem('hf_token'); location.href='/'; }
function _resume(){ try { return JSON.parse(localStorage.getItem('hf_resume') || '{}') || {}; } catch(e) { return {}; } }
function _money(n, cur){
  n = Math.round(Number(n) || 0);
  try { return new Intl.NumberFormat(undefined, { style:'currency', currency:(cur||'USD'), maximumFractionDigits:0 }).format(n); }
  catch(e) { return (cur||'USD') + ' ' + n.toLocaleString(); }
}
function _moneyK(n, cur){
  n = Math.round(Number(n) || 0);
  if (n >= 1000) return _money(Math.round(n/1000)*1000, cur).replace(/,000/,'K').replace(/000/,'K');
  return _money(n, cur);
}

function _emptyState(){
  var steps = [
    ['Enter a role', 'Job title, plus a location if you have one in mind.'],
    ['Get a typical range', 'Low, median, and high pay with percentile breakdown.'],
    ['Check your offer', 'Compare an offer against the market and get a negotiation tip.'],
  ];
  document.getElementById('sw-body').innerHTML =
    '<div class="sw-empty">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>'
    + '<h4>What is this role worth?</h4>'
    + '<p>Enter a job title above to see a typical pay range, what drives it, and whether your offer is fair.</p>'
    + '<div class="sw-steps">'
    + steps.map(function(s,i){ return '<div class="sw-step"><span class="sw-step-n">'+(i+1)+'</span><div><div class="sw-step-t">'+s[0]+'</div><div class="sw-step-d">'+s[1]+'</div></div></div>'; }).join('')
    + '</div></div>';
}

function _gate(){
  document.getElementById('sw-body').innerHTML =
    '<div class="sw-gate"><span class="badge">Free look used</span>'
    + '<h4>Unlimited salary insights</h4>'
    + '<p>Pay-range insights on any role are free and unlimited.</p>'
    + '<a class="btn btn-primary" href="pricing">'+ICON('sparkle','ico ico-sm')+' See plans</a></div>';
}

function _loadingState(){
  document.getElementById('sw-body').innerHTML =
    '<div class="section-card"><div class="sw-skel" aria-hidden="true" role="status" aria-label="Loading salary insights">'
    + '<div class="sw-skel-head"><div class="sw-skel-head-l">'
    + '<span class="sw-sk sw-sk-title"></span><span class="sw-sk sw-sk-sub"></span><span class="sw-sk sw-sk-pill"></span>'
    + '</div><span class="sw-sk sw-sk-pill" style="width:120px;"></span></div>'
    + '<span class="sw-sk sw-sk-lg"></span><span class="sw-sk sw-sk-sub" style="width:46%;"></span>'
    + '<span class="sw-sk sw-sk-bar"></span>'
    + '<div class="sw-sk-legend"><span class="sw-sk"></span><span class="sw-sk"></span><span class="sw-sk"></span></div>'
    + '<span class="sw-sk sw-sk-section"></span>'
    + '<span class="sw-sk sw-sk-line w95"></span><span class="sw-sk sw-sk-line w85"></span><span class="sw-sk sw-sk-line w70"></span>'
    + '<span class="sw-sk sw-sk-section"></span><span class="sw-sk sw-sk-block"></span>'
    + '</div></div>';
}

function _render(d){
  if (!d || typeof d.median !== 'number') {
    document.getElementById('sw-body').innerHTML =
      '<div class="sw-empty" style="color:var(--danger);"><h4 style="color:var(--danger);">Invalid response</h4><p>Try again.</p></div>';
    return;
  }
  _lastData = d;
  var cur = d.currency || 'USD';
  var lo = Number(d.low)||0, mid = Number(d.median)||0, hi = Number(d.high)||0;
  var conf = (['low','medium','high'].indexOf(d.confidence) >= 0) ? d.confidence : 'medium';

  var srcPill = (d.source === 'adzuna')
    ? '<span class="sw-src sw-src-live" title="Based on real job listings">● Live data - '+(Number(d.sampleSize)||0).toLocaleString()+' listings</span>'
    : '<span class="sw-src sw-src-est" title="AI estimate">● AI estimate</span>';

  var p10 = Math.round(lo * 0.8), p25 = lo, p50 = mid, p75 = hi, p90 = Math.round(hi * 1.15);
  var medPct = (hi > lo) ? Math.max(5, Math.min(95, ((mid - lo) / (hi - lo)) * 100)) : 50;

  var base = d.base || mid;
  var bonus = d.bonus || Math.round(mid * 0.1);
  var equity = d.equity || Math.round(mid * 0.05);
  var totalComp = base + bonus + equity;

  var factors = Array.isArray(d.factors) ? d.factors : [];

  // Build tabs: Overview | Breakdown | Compare
  var hasLevels = d.levels && typeof d.levels === 'object' && Object.keys(d.levels).length;
  var hasLocs = d.locations && Array.isArray(d.locations) && d.locations.length > 1;

  var html = '<div class="sw-result">';

  // Header
  html += '<div class="sw-res-head"><div>'
    + '<div class="sw-res-role">'+esc(d.role||'')+'</div>'
    + '<div class="sw-res-loc">'+esc(d.location||'Not specified')+(d.level ? ' - '+esc(d.level) : '')+'</div>'
    + '<div class="sw-res-meta">'+srcPill+'</div></div>'
    + '<span class="sw-conf '+conf+'">'+conf+' confidence</span></div>';

  // Big number
  html += '<div class="sw-median">'+_money(mid,cur)+' <small>/ year median</small></div>'
    + '<div class="sw-range-lbl">Typical range '+_money(lo,cur)+' - '+_money(hi,cur)+'</div>';

  // Interactive range bar
  html += '<div class="sw-range-bar" id="sw-bar" data-lo="'+lo+'" data-hi="'+hi+'" data-cur="'+cur+'">'
    + '<div class="sw-range-track"></div>'
    + '<div class="sw-range-fill" style="left:0%; width:'+medPct.toFixed(1)+'%;"></div>'
    + '<div class="sw-range-thumb" style="left:'+medPct.toFixed(1)+'%;"></div>'
    + '<div class="sw-range-tooltip" id="range-tooltip">'+_money(mid,cur)+'</div>'
    + '</div>'
    + '<div class="sw-range-labels"><span>'+_moneyK(lo,cur)+'</span><span style="color:var(--accent); font-weight:700;">Median '+_moneyK(mid,cur)+'</span><span>'+_moneyK(hi,cur)+'</span></div>';

  // Tabs
  html += '<div class="sw-tabs">'
    + '<button class="sw-tab active" data-tab="overview">Overview</button>'
    + '<button class="sw-tab" data-tab="breakdown">Breakdown</button>';
  if (hasLevels || hasLocs) html += '<button class="sw-tab" data-tab="compare">Compare</button>';
  html += '</div>';

  // Tab: Overview
  html += '<div class="sw-tab-panel active" id="tab-overview">';

  // Percentile cards (clickable)
  html += '<div class="sw-section-t">'+ICON('chart','ico ico-sm')+' Percentile breakdown</div>'
    + '<div class="sw-percentile-grid" id="perc-grid">'
    + _percCard('10th', p10, cur, false)
    + _percCard('25th', p25, cur, false)
    + _percCard('50th', p50, cur, true)
    + _percCard('75th', p75, cur, false)
    + _percCard('90th', p90, cur, false)
    + '</div>';

  // Offer calc (live-updating)
  html += '<div class="sw-section-t">'+ICON('calculator','ico ico-sm')+' Check your offer</div>'
    + '<div class="sw-offer-calc">'
    + '<div class="sw-offer-row">'
    + '<div class="sw-offer-field"><label>Your base offer</label><input type="number" id="offer-base" placeholder="e.g. 120000" step="1000" min="0"></div>'
    + '<div class="sw-offer-field"><label>Bonus + equity (optional)</label><input type="number" id="offer-extra" placeholder="e.g. 30000" step="1000" min="0"></div>'
    + '</div>'
    + '<div id="offer-result" style="display:none;"></div>'
    + '</div>';

  // Factors
  if (factors.length) {
    html += '<div class="sw-section-t">'+ICON('bulb','ico ico-sm')+' What moves the pay</div>'
      + '<ul class="sw-factors">'
      + factors.map(function(f){ return '<li>'+ICON('check','ico ico-sm')+'<span>'+esc(f)+'</span></li>'; }).join('')
      + '</ul>';
  }

  // Negotiation tip
  if (d.negotiation) {
    html += '<div class="sw-section-t">'+ICON('message','ico ico-sm')+' Negotiation tip</div>'
      + '<div class="sw-nego">'+esc(d.negotiation)+'</div>';
  }

  html += '</div>'; // end tab-overview

  // Tab: Breakdown
  html += '<div class="sw-tab-panel" id="tab-breakdown">';

  // Comp breakdown
  html += '<div class="sw-section-t">'+ICON('wallet','ico ico-sm')+' Total compensation estimate</div>'
    + '<div class="sw-comp-breakdown">'
    + '<div class="sw-comp-card base"><div class="sw-comp-label">Base salary</div><div class="sw-comp-value">'+_money(base,cur)+'</div><div class="sw-comp-pct">~'+Math.round(base/totalComp*100)+'%</div></div>'
    + '<div class="sw-comp-card bonus"><div class="sw-comp-label">Annual bonus</div><div class="sw-comp-value">'+_money(bonus,cur)+'</div><div class="sw-comp-pct">~'+Math.round(bonus/totalComp*100)+'%</div></div>'
    + '<div class="sw-comp-card equity"><div class="sw-comp-label">Equity (annualized)</div><div class="sw-comp-value">'+_money(equity,cur)+'</div><div class="sw-comp-pct">~'+Math.round(equity/totalComp*100)+'%</div></div>'
    + '</div>'
    + '<div class="sw-comp-total">Total: '+_money(totalComp,cur)+'/yr</div>';

  // Remote + trend as insight cards
  var insightsHtml = '';
  if (d.remotePct !== undefined && d.remotePct !== null) {
    var diff = d.remotePct > 0 ? '+' : '';
    insightsHtml += '<div class="sw-insight-card">'
      + '<div class="sw-insight-icon" style="background:var(--accent-soft); color:var(--accent);">'+ICON('wifi','ico')+'</div>'
      + '<div><div class="sw-insight-title">Remote pay differential</div>'
      + '<div class="sw-insight-value">Remote roles pay <strong style="color:var(--accent);">'+diff+d.remotePct+'%</strong> '+(d.remotePct>0?'more':'less')+' than on-site</div></div></div>';
  }
  if (d.trend) {
    var tc = d.trend === 'up' ? 'var(--success-text)' : (d.trend === 'down' ? 'var(--danger-text)' : 'var(--warning-text)');
    var tbg = d.trend === 'up' ? 'var(--success-soft)' : (d.trend === 'down' ? 'var(--danger-soft)' : 'var(--warning-soft)');
    var tIcon = d.trend === 'up' ? 'trending-up' : (d.trend === 'down' ? 'trending-down' : 'minus');
    insightsHtml += '<div class="sw-insight-card">'
      + '<div class="sw-insight-icon" style="background:'+tbg+'; color:'+tc+';">'+ICON(tIcon,'ico')+'</div>'
      + '<div><div class="sw-insight-title">Market trend</div>'
      + '<div class="sw-insight-value">Pay trending <strong style="color:'+tc+';">'+d.trend+(d.trendPct?' '+d.trendPct+'%':'')+'</strong> year-over-year</div></div></div>';
  }
  if (insightsHtml) {
    html += '<div class="sw-section-t">'+ICON('chart-dots','ico ico-sm')+' Market insights</div>'
      + '<div class="sw-insights-row">'+insightsHtml+'</div>';
  }

  html += '</div>'; // end tab-breakdown

  // Tab: Compare
  if (hasLevels || hasLocs) {
    html += '<div class="sw-tab-panel" id="tab-compare">';

    if (hasLevels) {
      html += '<div class="sw-section-t">'+ICON('stairs','ico ico-sm')+' By experience level</div>'
        + '<div class="sw-level-grid" id="level-grid">';
      for (var lvl in d.levels) {
        if (!d.levels.hasOwnProperty(lvl)) continue;
        var ld = d.levels[lvl];
        var isSel = (d.level && d.level === lvl) || (!d.level && lvl === 'Senior');
        html += '<div class="sw-level-card'+(isSel?' selected':'')+'" data-lvl="'+esc(lvl)+'" data-med="'+(ld.median||0)+'">'
          + '<div class="sw-level-label">'+esc(lvl)+'</div>'
          + '<div class="sw-level-median">'+_money(ld.median||0,cur)+'</div>'
          + '<div class="sw-level-range">'+_moneyK(ld.low||0,cur)+' - '+_moneyK(ld.high||0,cur)+'</div></div>';
      }
      html += '</div>';
    }

    if (hasLocs) {
      html += '<div class="sw-section-t">'+ICON('map-pin','ico ico-sm')+' Compare locations</div>'
        + '<div class="sw-loc-grid" id="loc-grid">';
      d.locations.forEach(function(loc) {
        var diffPct = mid > 0 ? Math.round(((loc.median||0) - mid) / mid * 100) : 0;
        var diffCls = diffPct > 0 ? 'up' : (diffPct < 0 ? 'down' : '');
        var diffStr = diffPct > 0 ? '+'+diffPct+'%' : diffPct+'%';
        html += '<div class="sw-loc-card" data-loc="'+esc(loc.name)+'" data-med="'+(loc.median||0)+'">'
          + '<div class="sw-loc-name">'+esc(loc.name)+'</div>'
          + '<div class="sw-loc-median">'+_money(loc.median||0,cur)+'</div>'
          + '<div class="sw-loc-range">'+_moneyK(loc.low||0,cur)+' - '+_moneyK(loc.high||0,cur)+'</div>'
          + (diffPct !== 0 ? '<div class="sw-loc-diff '+diffCls+'">'+diffStr+' vs your search</div>' : '')
          + '</div>';
      });
      html += '</div>';
    }

    html += '</div>'; // end tab-compare
  }

  // Disclaimer
  html += '<div class="sw-disclaimer">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    + '<span>'+esc(d.disclaimer||'AI estimate, not live market data. Verify before deciding.')+'</span></div>';

  html += '</div>'; // end sw-result

  document.getElementById('sw-body').innerHTML = html;

  // Wire up interactions
  _wireRangeBar(lo, hi, mid, cur);
  _wireTabs();
  _wirePercentileCards(lo, hi, cur);
  _wireLiveOffer(mid, lo, hi, cur);
  _wireLevelCards(cur);
  _wireLocCards(cur);
}

function _percCard(label, val, cur, active) {
  return '<div class="sw-percentile-card'+(active?' active':'')+'" data-val="'+val+'">'
    + '<div class="sw-percentile-label">'+label+'</div>'
    + '<div class="sw-percentile-value">'+_moneyK(val,cur)+'</div></div>';
}

function _wireRangeBar(lo, hi, mid, cur) {
  var bar = document.getElementById('sw-bar');
  var tooltip = document.getElementById('range-tooltip');
  var fill = bar ? bar.querySelector('.sw-range-fill') : null;
  var thumb = bar ? bar.querySelector('.sw-range-thumb') : null;
  if (!bar || !tooltip) return;

  bar.addEventListener('mousemove', function(e) {
    var rect = bar.getBoundingClientRect();
    var rel = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    var val = Math.round(lo + rel * (hi - lo));
    tooltip.textContent = _money(val, cur);
    tooltip.style.left = (rel * 100).toFixed(1) + '%';
    if (fill) fill.style.width = (rel * 100).toFixed(1) + '%';
    if (thumb) thumb.style.left = (rel * 100).toFixed(1) + '%';
  });
  bar.addEventListener('mouseleave', function() {
    var medPct = (hi > lo) ? ((mid - lo) / (hi - lo) * 100) : 50;
    tooltip.textContent = _money(mid, cur);
    tooltip.style.left = medPct.toFixed(1) + '%';
    if (fill) fill.style.width = medPct.toFixed(1) + '%';
    if (thumb) thumb.style.left = medPct.toFixed(1) + '%';
  });
}

function _wireTabs() {
  document.querySelectorAll('.sw-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.sw-tab').forEach(function(t){ t.classList.remove('active'); });
      document.querySelectorAll('.sw-tab-panel').forEach(function(p){ p.classList.remove('active'); });
      tab.classList.add('active');
      var panel = document.getElementById('tab-' + tab.getAttribute('data-tab'));
      if (panel) panel.classList.add('active');
    });
  });
}

function _wirePercentileCards(lo, hi, cur) {
  var grid = document.getElementById('perc-grid');
  if (!grid) return;
  grid.addEventListener('click', function(e) {
    var card = e.target.closest('.sw-percentile-card');
    if (!card) return;
    grid.querySelectorAll('.sw-percentile-card').forEach(function(c){ c.classList.remove('active'); });
    card.classList.add('active');
    var val = Number(card.getAttribute('data-val'));
    var bar = document.getElementById('sw-bar');
    if (bar) {
      var pct = (hi > lo) ? ((val - lo) / (hi - lo) * 100) : 50;
      pct = Math.max(0, Math.min(100, pct));
      var fill = bar.querySelector('.sw-range-fill');
      var thumb = bar.querySelector('.sw-range-thumb');
      var tooltip = document.getElementById('range-tooltip');
      if (fill) fill.style.width = pct.toFixed(1) + '%';
      if (thumb) thumb.style.left = pct.toFixed(1) + '%';
      if (tooltip) { tooltip.textContent = _money(val, cur); tooltip.style.left = pct.toFixed(1) + '%'; }
    }
  });
}

function _wireLiveOffer(median, lo, hi, cur) {
  var baseEl = document.getElementById('offer-base');
  var extraEl = document.getElementById('offer-extra');
  var resultEl = document.getElementById('offer-result');
  if (!baseEl || !resultEl) return;

  function update() {
    var base = parseInt(baseEl.value || '0', 10);
    var extra = parseInt(extraEl.value || '0', 10);
    if (!base) { resultEl.style.display = 'none'; return; }
    var total = base + extra;
    var pct = ((total - median) / median * 100).toFixed(1);
    var verdict, cls, meterPct, meterColor;
    if (total >= hi * 0.95) {
      verdict = 'Strong offer - above 75th percentile'; cls = 'good';
      meterPct = Math.min(100, 75 + ((total - hi*0.95) / (hi*0.25)) * 25);
      meterColor = 'var(--success)';
    } else if (total >= median) {
      verdict = 'Fair offer - at or above median'; cls = 'good';
      meterPct = 50 + ((total - median) / (hi*0.95 - median)) * 25;
      meterColor = 'var(--success)';
    } else if (total >= lo) {
      verdict = 'Below median - room to negotiate'; cls = 'fair';
      meterPct = 20 + ((total - lo) / (median - lo)) * 30;
      meterColor = 'var(--warning)';
    } else {
      verdict = 'Low offer - significantly below market'; cls = 'low';
      meterPct = Math.max(5, (total / lo) * 20);
      meterColor = 'var(--danger)';
    }
    meterPct = Math.max(5, Math.min(100, meterPct));
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<div class="sw-offer-meter"><div class="sw-offer-meter-fill" style="width:'+Math.round(meterPct)+'%; background:'+meterColor+';"></div></div>'
      + '<div class="sw-offer-verdict '+cls+'">'+verdict+'</div>'
      + '<div class="sw-offer-detail">Your total: '+_money(total,cur)+' vs median '+_money(median,cur)+' ('+(pct>=0?'+':'')+pct+'%)</div>';
  }

  baseEl.addEventListener('input', update);
  extraEl.addEventListener('input', update);
}

function _wireLevelCards(cur) {
  var grid = document.getElementById('level-grid');
  if (!grid) return;
  grid.addEventListener('click', function(e) {
    var card = e.target.closest('.sw-level-card');
    if (!card) return;
    grid.querySelectorAll('.sw-level-card').forEach(function(c){ c.classList.remove('selected'); });
    card.classList.add('selected');
    var lvl = card.getAttribute('data-lvl');
    var med = Number(card.getAttribute('data-med'));
    toast(lvl + ' median: ' + _money(med, cur), {type:'info'});
  });
}

function _wireLocCards(cur) {
  var grid = document.getElementById('loc-grid');
  if (!grid) return;
  grid.addEventListener('click', function(e) {
    var card = e.target.closest('.sw-loc-card');
    if (!card) return;
    grid.querySelectorAll('.sw-loc-card').forEach(function(c){ c.classList.remove('selected'); });
    card.classList.add('selected');
    var name = card.getAttribute('data-loc');
    var med = Number(card.getAttribute('data-med'));
    document.getElementById('sw-location').value = name;
    toast('Selected ' + name + ' - median ' + _money(med, cur), {type:'info'});
  });
}

async function lookup(){
  if (IS_ANON) { promptSignup('see salary insights for any role'); return; }
  var role = document.getElementById('sw-role').value.trim();
  var location = document.getElementById('sw-location').value.trim();
  if (!role) { toast('Enter a job title first', {type:'warn'}); document.getElementById('sw-role').focus(); return; }

  _loadingState();
  document.getElementById('sw-go').disabled = true;
  try {
    var r = await fetch(API + '/ai/salary', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
      body: JSON.stringify({ role: role, location: location, level: level, resume: _resume() })
    });
    if (r.status === 402) { _gate(); return; }
    if (!r.ok) { var e = await r.json().catch(function(){return {};}); throw new Error(e.error || 'AI failed'); }
    var d = await r.json();
    if (typeof d.median !== 'number') throw new Error('empty');
    _render(d);
    _track('salary_open');
  } catch(e){
    document.getElementById('sw-body').innerHTML =
      '<div class="sw-empty" style="color:var(--danger);"><h4 style="color:var(--danger);">Could not estimate that</h4><p>'+esc(e.message||'Try a more common job title.')+'</p></div>';
  } finally {
    document.getElementById('sw-go').disabled = false;
  }
}

document.getElementById('sw-levels').addEventListener('click', function(e){
  var b = e.target.closest('.sw-chip'); if (!b) return;
  level = b.getAttribute('data-level') || '';
  document.querySelectorAll('.sw-chip').forEach(function(x){ x.classList.remove('active'); });
  b.classList.add('active');
});
document.getElementById('sw-go').addEventListener('click', lookup);
document.getElementById('sw-role').addEventListener('keydown', function(e){ if (e.key === 'Enter') lookup(); });
document.getElementById('sw-location').addEventListener('keydown', function(e){ if (e.key === 'Enter') lookup(); });

(async function() {
  _emptyState();
  try {
    await loadCurrentUser();
    document.getElementById('sw-title').innerHTML = ICON('gauge') + ' <span>Salary Insights</span>';
    document.getElementById('sw-go').innerHTML = ICON('sparkle') + ' <span>Show pay range</span>';
    var planPill = document.getElementById('plan-pill');
    if (isPaid()) planPill.innerHTML = '<button class="pill success" onclick="openBillingPortal()" style="cursor:pointer;">'+ICON('crown','ico ico-sm')+' '+planLabel()+'</button>';
    else planPill.innerHTML = '<a class="btn btn-primary btn-xs" href="pricing">'+ICON('sparkle','ico ico-sm')+' <span>Upgrade</span></a>';
    try {
      var rz = _resume();
      var top = (rz.experience || [])[0];
      if (top && top.title) document.getElementById('sw-role').value = top.title;
    } catch(e) {}
  } catch(e) {
    console.warn('Salary page: user load failed', e);
    document.getElementById('sw-title').innerHTML = ICON('gauge') + ' <span>Salary Insights</span>';
    document.getElementById('sw-go').innerHTML = ICON('sparkle') + ' <span>Show pay range</span>';
  }
})();
