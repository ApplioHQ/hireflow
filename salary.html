    'QA Engineer','Test Engineer','Security Engineer','Cloud Engineer',
    'iOS Developer','Android Developer','Mobile Engineer',
    'Solutions Architect','Technical Program Manager','Technical Writer'
  ];
  var input = document.getElementById('sw-role');
  var list = document.getElementById('sw-role-list');
  var activeIdx = -1;
  function show(matches){
    if (!matches.length) { list.classList.remove('open'); input.setAttribute('aria-expanded','false'); return; }
    list.innerHTML = matches.map(function(t,i){ return '<div class="sw-combo-item'+(i===activeIdx?' active':'')+'" role="option" data-idx="'+i+'">'+esc(t)+'</div>'; }).join('');
    list.classList.add('open'); input.setAttribute('aria-expanded','true');
  }
  function filter(){
    var q = input.value.trim().toLowerCase(); activeIdx = -1;
    if (q.length < 1) { list.classList.remove('open'); input.setAttribute('aria-expanded','false'); return; }
    var m = TITLES.filter(function(t){ return t.toLowerCase().indexOf(q) >= 0; }).slice(0,8);
    show(m);
  }
  input.addEventListener('input', filter);
  input.addEventListener('focus', function(){ if (input.value.trim().length >= 1) filter(); });
  list.addEventListener('mousedown', function(e){
    var item = e.target.closest('.sw-combo-item');
    if (!item) return;
    e.preventDefault();
    input.value = item.textContent;
    list.classList.remove('open'); input.setAttribute('aria-expanded','false');
  });
  input.addEventListener('keydown', function(e){
    var items = list.querySelectorAll('.sw-combo-item');
    if (!items.length || !list.classList.contains('open')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx+1, items.length-1); items.forEach(function(el,i){ el.classList.toggle('active',i===activeIdx); }); items[activeIdx].scrollIntoView({block:'nearest'}); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); items.forEach(function(el,i){ el.classList.toggle('active',i===activeIdx); }); items[activeIdx].scrollIntoView({block:'nearest'}); }
    else if (e.key === 'Enter' && activeIdx >= 0) { e.preventDefault(); input.value = items[activeIdx].textContent; list.classList.remove('open'); input.setAttribute('aria-expanded','false'); }
    else if (e.key === 'Escape') { list.classList.remove('open'); input.setAttribute('aria-expanded','false'); }

function _money(n, cur){
  n = Math.round(Number(n) || 0);
  try { return new Intl.NumberFormat(undefined, { style:'currency', currency:(cur||'USD'), maximumFractionDigits:0 }).format(n); }
  catch(e) { return (cur||'USD') + ' ' + n.toLocaleString(); }
}
function _moneyK(n, cur){
  n = Math.round(Number(n) || 0);
  if (n >= 1000) return _money(Math.round(n/1000)*1000, cur).replace(/,000/,'K').replace(/000/,'K');
  return _money(n, cur);
}

function _render(d){

  var conf = (['low','medium','high'].indexOf(d.confidence) >= 0) ? d.confidence : 'medium';

  var p10 = Math.round(lo * 0.8), p90 = Math.round(hi * 1.15);

  var eqPct = Math.round(equity/totalComp*100);

  // Disclaimer
  html += '<div class="sw-disclaimer">'
    + '<span class="ico ico-sm" style="display:inline-flex; opacity:.7;">'+_svgInfo+'</span>'
    + '<span>'+esc(d.disclaimer||'AI estimate based on aggregated market data, not a guarantee. Verify with current offers before making career decisions.')+'</span></div>';

  html += '</div>'; // end sw-result

  document.getElementById('sw-body').innerHTML = html;

  _wireRangeBar(lo, hi, mid, cur);
  _wireLiveOffer(mid, lo, hi, cur);
  _wireLocCards(cur);
  _wireDisclosure();
}

function _wireRangeBar(lo, hi, mid, cur) {
  var bar = document.getElementById('sw-bar');
  var tooltip = document.getElementById('range-tooltip');
  var fill = bar ? bar.querySelector('.sw-range-fill') : null;
  var thumb = bar ? bar.querySelector('.sw-range-thumb') : null;
  if (!bar || !tooltip) return;
  var p10 = Math.round(lo * 0.8), p90 = Math.round(hi * 1.15);

  bar.addEventListener('mousemove', function(e) {
    var rect = bar.getBoundingClientRect();
    var rel = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    var val = Math.round(p10 + rel * (p90 - p10));
    tooltip.textContent = _money(val, cur);
    tooltip.style.left = (rel * 100).toFixed(1) + '%';
    if (fill) fill.style.width = (rel * 100).toFixed(1) + '%';
    if (thumb) thumb.style.left = (rel * 100).toFixed(1) + '%';
  });
  bar.addEventListener('mouseleave', function() {
    var medPct = (p90 > p10) ? ((mid - p10) / (p90 - p10) * 100) : 50;
    tooltip.textContent = _money(mid, cur);
    tooltip.style.left = medPct.toFixed(1) + '%';
    if (fill) fill.style.width = medPct.toFixed(1) + '%';
    if (thumb) thumb.style.left = medPct.toFixed(1) + '%';
  });
}

function _wireLiveOffer(median, lo, hi, cur) {
  var baseEl = document.getElementById('offer-base');
  var extraEl = document.getElementById('offer-extra');
  var resultEl = document.getElementById('offer-result');
  if (!baseEl || !resultEl) return;

  function update() {
    var base = parseInt(baseEl.value || '0', 10);
    var extra = parseInt(extraEl.value || '0', 10);
    if (!base) { resultEl.style.display = 'none'; return; }
    var total = base + extra;
    var pctDiff = ((total - median) / median * 100);
    var pctStr = pctDiff.toFixed(1);
    var p75 = hi;
    var verdict, verdictRight, cls, meterPct, meterColor;
    if (total >= hi * 0.95) {
      verdict = 'Strong offer'; verdictRight = _money(total,cur)+' total -- above 75th percentile'; cls = 'good';
      meterPct = Math.min(100, 75 + ((total - hi*0.95) / (hi*0.25)) * 25);
      meterColor = 'var(--success)';
    } else if (total >= median) {
      verdict = 'Competitive offer'; verdictRight = _money(total,cur)+' total -- '+Math.round(50 + pctDiff/2)+'th percentile'; cls = 'good';
      meterPct = 50 + ((total - median) / (hi*0.95 - median)) * 25;
      meterColor = 'var(--success)';
    } else if (total >= lo) {
      verdict = 'Below median'; verdictRight = _money(total,cur)+' total -- room to negotiate'; cls = 'fair';
      meterPct = 20 + ((total - lo) / (median - lo)) * 30;
      meterColor = 'var(--warning)';
    } else {
      verdict = 'Low offer'; verdictRight = _money(total,cur)+' total -- significantly below market'; cls = 'low';
      meterPct = Math.max(5, (total / lo) * 20);
      meterColor = 'var(--danger)';
    }
    meterPct = Math.max(5, Math.min(100, meterPct));
    resultEl.style.display = 'block';
    resultEl.className = 'sw-offer-result ' + cls;
    resultEl.innerHTML = '<div class="sw-offer-verdict '+cls+'">'
      + '<span><span class="ico ico-sm" style="display:inline-flex;">'+_svgCheck+'</span> '+verdict+'</span>'
      + '<span style="font-weight:600; font-size:12px;">'+verdictRight+'</span></div>'
      + '<div class="sw-offer-meter"><div class="sw-offer-meter-fill" style="width:'+Math.round(meterPct)+'%; background:'+meterColor+';"></div></div>'
      + '<div class="sw-offer-detail">Your total of '+_money(total,cur)+' is '+(pctDiff>=0?'+':'')+pctStr+'% vs the median of '+_money(median,cur)+'.'
      + (total < p75 ? ' There\'s room to negotiate toward the 75th percentile ('+_moneyK(p75,cur)+').' : '')
      + '</div>';
  }

  baseEl.addEventListener('input', update);
  extraEl.addEventListener('input', update);
}

function _wireLocCards(cur) {
  var grid = document.getElementById('loc-grid');
  if (!grid) return;
  grid.addEventListener('click', function(e) {
    var card = e.target.closest('.sw-loc-card');
    if (!card) return;
    grid.querySelectorAll('.sw-loc-card').forEach(function(c){ c.classList.remove('selected'); });
    card.classList.add('selected');
    card.querySelector('.sw-loc-median').style.color = 'var(--accent)';
    var name = card.getAttribute('data-loc');
    var med = Number(card.getAttribute('data-med'));
    document.getElementById('sw-location').value = name;
    toast('Selected ' + name + ' -- median ' + _money(med, cur), {type:'info'});
  });
}

function _wireDisclosure() {
  var btn = document.getElementById('sw-disc-btn');
  var body = document.getElementById('sw-disc-body');
  if (!btn || !body) return;
  btn.addEventListener('click', function() {
    btn.classList.toggle('open');
    body.classList.toggle('open');
  });
}

async function lookup(){
  if (IS_ANON) { promptSignup('see salary insights for any role'); return; }
  var role = document.getElementById('sw-role').value.trim();
  var location = document.getElementById('sw-location').value.trim();
  if (!role) { toast('Enter a job title first', {type:'warn'}); document.getElementById('sw-role').focus(); return; }

  _loadingState();
  document.getElementById('sw-go').disabled = true;
  try {
    var r = await fetch(API + '/ai/salary', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
      body: JSON.stringify({ role: role, location: location, level: level, resume: _resume() })
    });
    if (r.status === 402) { _gate(); return; }
    if (!r.ok) { var e = await r.json().catch(function(){return {};}); throw new Error(e.error || 'AI failed'); }
    var d = await r.json();
    if (typeof d.median !== 'number') throw new Error('empty');
    _render(d);
    _track('salary_open');
  } catch(e){
    document.getElementById('sw-body').innerHTML =
      '<div class="sw-empty" style="color:var(--danger);"><h4 style="color:var(--danger);">Could not estimate that</h4><p>'+esc(e.message||'Try a more common job title.')+'</p></div>';
  } finally {
    document.getElementById('sw-go').disabled = false;
  }
}

document.getElementById('sw-levels').addEventListener('click', function(e){
  var b = e.target.closest('.sw-chip'); if (!b) return;
  level = b.getAttribute('data-level') || '';
  document.querySelectorAll('.sw-chip').forEach(function(x){ x.classList.remove('active'); });
  b.classList.add('active');
});
document.getElementById('sw-go').addEventListener('click', lookup);
document.getElementById('sw-role').addEventListener('keydown', function(e){ if (e.key === 'Enter') lookup(); });
document.getElementById('sw-location').addEventListener('keydown', function(e){ if (e.key === 'Enter') lookup(); });

(async function() {
  _emptyState();
  try {
    await loadCurrentUser();
    document.getElementById('sw-title').innerHTML = ICON('gauge') + ' <span>Salary Insights</span>';
    document.getElementById('sw-go').innerHTML = ICON('sparkle') + ' <span>Show pay range</span>';
    var planPill = document.getElementById('plan-pill');
    planPill.innerHTML = '<span class="pill success">'+ICON('sparkle','ico ico-sm')+' Free</span>';
    try {
      var rz = _resume();
      var top = (rz.experience || [])[0];
      if (top && top.title) document.getElementById('sw-role').value = top.title;
    } catch(e) {}
  } catch(e) {
    console.warn('Salary page: user load failed', e);
    document.getElementById('sw-title').innerHTML = ICON('gauge') + ' <span>Salary Insights</span>';
    document.getElementById('sw-go').innerHTML = ICON('sparkle') + ' <span>Show pay range</span>';
  }
})();
</script>
