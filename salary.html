<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Salary Insights | Applio</title>
<link rel="icon" href="logo.ico">
<link rel="stylesheet" href="css/styles.css">
<script src="js/theme.js"></script>
<style>
  .sw-wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; }
  .sw-head h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 800; letter-spacing: -.5px; display:flex; align-items:center; gap:10px; }
  .sw-head p { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .sw-grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; margin-top: 22px; align-items: start; }
  @media (max-width: 860px) { .sw-grid { grid-template-columns: 1fr; } }
  .sw-form label { display:block; font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; }
  .sw-form label:first-of-type { margin-top: 0; }
  .sw-form input { width:100%; box-sizing:border-box; padding: 10px 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text); font-size: 14px; font-family: inherit; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .sw-form input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
  .sw-levels { display:flex; flex-wrap:wrap; gap: 8px; }
  .sw-level { font-size: 12.5px; padding: 7px 13px; border-radius: var(--r-full); border: 1px solid var(--border); background: var(--bg-2); color: var(--text); cursor: pointer; transition: all var(--dur) var(--ease); }
  .sw-level:hover { border-color: var(--accent); }
  .sw-level.active { border-color: transparent; color: #fff; background: var(--gradient); box-shadow: var(--sh-1); }
  .sw-go { width:100%; margin-top: 18px; }
  .sw-out-card { min-height: 460px; display:flex; flex-direction: column; }
  .sw-empty { flex:1; display:flex; flex-direction: column; align-items:center; justify-content: center; text-align:center; color: var(--muted); padding: 40px; }
  .sw-empty svg { width: 46px; height: 46px; color: var(--accent); margin-bottom: 14px; opacity:.9; }
  .sw-empty h4 { color: var(--text); font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .sw-empty p { font-size: 13.5px; max-width: 360px; line-height: 1.6; }
  .sw-steps { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; text-align: left; max-width: 340px; width: 100%; }
  .sw-step { display: flex; gap: 11px; align-items: flex-start; }
  .sw-step-n { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: rgba(99,102,241,.16); border: 1px solid rgba(99,102,241,.3); color: var(--accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .sw-step-t { font-size: 13px; font-weight: 650; color: var(--text); }
  .sw-step-d { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 2px; }
  /* Result */
  .sw-res-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  .sw-res-role { font-size: 17px; font-weight: 800; }
  .sw-res-loc { font-size: 13px; color: var(--muted); }
  .sw-conf { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing:.06em; padding: 3px 9px; border-radius: var(--r-full); }
  .sw-conf.high { color:#22c55e; background:rgba(34,197,94,.14); }
  .sw-conf.medium { color:#f59e0b; background:rgba(245,158,11,.14); }
  .sw-conf.low { color:#ef4444; background:rgba(239,68,68,.14); }
  .sw-median { font-size: 34px; font-weight: 800; letter-spacing:-.5px; margin: 18px 0 2px; }
  .sw-median small { font-size: 15px; font-weight: 600; color: var(--muted); }
  .sw-range-lbl { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
  .sw-bar { position: relative; height: 12px; border-radius: 999px; background: linear-gradient(90deg, rgba(99,102,241,.25), var(--accent), rgba(139,92,246,.25)); margin: 34px 0 8px; }
  .sw-bar .sw-dot { position:absolute; top:50%; width:18px; height:18px; border-radius:50%; background:#fff; border:3px solid var(--accent); transform:translate(-50%,-50%); box-shadow:0 2px 10px rgba(0,0,0,.35); }
  .sw-bar .sw-tick { position:absolute; top:-26px; transform:translateX(-50%); font-size:12px; font-weight:700; white-space:nowrap; }
  .sw-bar .sw-tick.lo { left:0; transform:none; color:var(--muted); }
  .sw-bar .sw-tick.hi { right:0; left:auto; transform:none; color:var(--muted); }
  .sw-scale { display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); }
  .sw-section-t { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:24px 0 10px; }
  .sw-factors { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:9px; }
  .sw-factors li { display:flex; gap:9px; align-items:flex-start; font-size:13.5px; line-height:1.5; }
  .sw-factors li svg { flex-shrink:0; width:16px; height:16px; color:var(--accent); margin-top:2px; }
  .sw-nego { background: var(--bg-2); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius: var(--r-sm); padding: 12px 14px; font-size:13.5px; line-height:1.55; }
  .sw-nego strong { color: var(--text); }
  .sw-disclaimer { margin-top: 20px; font-size: 11.5px; color: var(--muted); line-height:1.5; display:flex; gap:8px; align-items:flex-start; }
  .sw-disclaimer svg { flex-shrink:0; width:15px; height:15px; margin-top:1px; opacity:.8; }
  .sw-loading { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--muted); padding:40px; }
  .sw-loading .sw-spark { width:34px; height:34px; color:var(--accent); animation: swPulse 1.3s ease-in-out infinite; margin-bottom:16px; }
  @keyframes swPulse { 0%,100%{ transform:scale(1); opacity:1;} 50%{ transform:scale(.82); opacity:.55;} }
  @media (prefers-reduced-motion: reduce) { .sw-loading .sw-spark { animation:none; } }
  .sw-gate { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 44px 30px; }
  .sw-gate .badge { font-size: 11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color: var(--accent); background: rgba(99,102,241,.14); border:1px solid rgba(99,102,241,.3); border-radius: var(--r-full); padding: 5px 12px; margin-bottom: 16px; }
  .sw-gate h4 { font-size: 19px; font-weight: 800; margin-bottom: 8px; }
  .sw-gate p { color: var(--muted); font-size: 14px; max-width: 380px; line-height:1.6; margin-bottom: 18px; }
</style>
</head>
<body class="app-body-scroll">
<header class="app-topbar">
  <div class="brand"><img src="logo.jpeg" width="32" height="32" class="brand-logo" alt="Applio"><span>Applio</span></div>
  <nav class="topbar-tabs">
    <a class="topbar-tab" href="dashboard">Home</a>
    <a class="topbar-tab" href="autopilot">Autopilot</a>
    <a class="topbar-tab" href="editor">Resume Builder</a>
    <a class="topbar-tab" href="match">Best Match</a>
    <a class="topbar-tab active" href="salary">Salary Insights</a>
    <a class="topbar-tab" href="assistant">Career Coach</a>
  </nav>
  <div class="topbar-right">
    <span id="health-badge"></span>
    <span id="plan-pill"></span>
    <button class="theme-toggle" onclick="toggleTheme()">☀️ Light</button>
    <button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button>
  </div>
</header>

<main class="sw-wrap">
  <div class="sw-head">
    <h1 id="sw-title"></h1>
    <p>See typical pay ranges for a role and location, so you can tell which opportunities are worth your time.</p>
    <p class="sw-free" id="sw-free" style="display:none; font-size:12.5px; color:var(--muted); margin-top:8px;"></p>
  </div>

  <div class="sw-grid">
    <!-- Form -->
    <div class="section-card sw-form">
      <label>Job title</label>
      <input id="sw-role" placeholder="e.g. Product Manager" autocomplete="off">

      <label>Location <span style="font-weight:400;color:var(--muted);">(optional)</span></label>
      <input id="sw-location" placeholder="e.g. Austin, TX or Remote (US)" autocomplete="off">

      <label>Seniority <span style="font-weight:400;color:var(--muted);">(optional)</span></label>
      <div class="sw-levels" id="sw-levels">
        <button type="button" class="sw-level active" data-level="">Auto</button>
        <button type="button" class="sw-level" data-level="Entry">Entry</button>
        <button type="button" class="sw-level" data-level="Mid">Mid</button>
        <button type="button" class="sw-level" data-level="Senior">Senior</button>
        <button type="button" class="sw-level" data-level="Lead / Staff">Lead</button>
      </div>

      <button class="btn btn-primary sw-go" id="sw-go"></button>
    </div>

    <!-- Output -->
    <div class="section-card sw-out-card" id="sw-out">
      <div id="sw-body"></div>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/notify.js"></script>
<script src="js/plan.js"></script>
<script src="js/health-badge.js"></script>
<script>
const API = window.HIREFLOW_CONFIG.API_URL;
const TOKEN = localStorage.getItem('hf_token');
function _track(name,meta){if(!TOKEN)return;fetch(window.HIREFLOW_CONFIG.API_URL+'/track',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify({name,meta})}).catch(()=>{});}
const IS_ANON = !TOKEN; if (IS_ANON) window.addEventListener('load', initAnonTopbar);
let level = '';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function signOut(){ localStorage.removeItem('hf_token'); location.href='/'; }
function _resume(){ try { return JSON.parse(localStorage.getItem('hf_resume') || '{}') || {}; } catch { return {}; } }

// Format an integer as currency (no decimals), best-effort by ISO code.
function _money(n, cur){
  n = Math.round(Number(n) || 0);
  try { return new Intl.NumberFormat(undefined, { style:'currency', currency:(cur||'USD'), maximumFractionDigits:0 }).format(n); }
  catch { return (cur||'USD') + ' ' + n.toLocaleString(); }
}

function _emptyState(){
  var steps = [
    ['Enter a role', 'Job title, plus a location if you have one in mind.'],
    ['Get a typical range', 'Low, median, and high base pay for that role.'],
    ['Decide with context', 'What moves pay, a negotiation tip, and how confident the estimate is.'],
  ];
  document.getElementById('sw-body').innerHTML =
    '<div class="sw-empty">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>'
    + '<h4>What\'s this role worth?</h4>'
    + '<p>Enter a job title on the left to see a typical pay range and what drives it, so you know which opportunities deserve your time.</p>'
    + '<div class="sw-steps">'
    +   steps.map(function(s,i){ return '<div class="sw-step"><span class="sw-step-n">' + (i+1) + '</span><div><div class="sw-step-t">' + s[0] + '</div><div class="sw-step-d">' + s[1] + '</div></div></div>'; }).join('')
    + '</div>'
    + '</div>';
}

function _gate(){
  document.getElementById('sw-body').innerHTML =
    '<div class="sw-gate">'
    + '<span class="badge">Free look used</span>'
    + '<h4>Unlock unlimited salary insights</h4>'
    + '<p>You\'ve used your free salary lookups. Upgrade to Premium or Lifetime for unlimited pay-range insights on any role.</p>'
    + '<a class="btn btn-primary" href="pricing">' + ICON('sparkle','ico ico-sm') + ' See plans</a>'
    + '</div>';
}

function _loadingState(){
  document.getElementById('sw-body').innerHTML =
    '<div class="sw-loading">'
    + '<svg class="sw-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>'
    + '<div style="font-weight:600;color:var(--text);">Estimating pay range…</div>'
    + '<div style="font-size:12.5px;margin-top:4px;">Weighing role, seniority, and location.</div>'
    + '</div>';
}

function _render(d){
  var cur = d.currency || 'USD';
  // Dot position for the median within the low-high band.
  var lo = Number(d.low)||0, mid = Number(d.median)||0, hi = Number(d.high)||0;
  var pct = (hi > lo) ? Math.max(4, Math.min(96, ((mid - lo) / (hi - lo)) * 100)) : 50;
  var conf = (['low','medium','high'].indexOf(d.confidence) >= 0) ? d.confidence : 'medium';

  var factors = Array.isArray(d.factors) ? d.factors : [];
  var factorsHtml = factors.length
    ? '<div class="sw-section-t">What moves the pay</div><ul class="sw-factors">'
      + factors.map(function(f){ return '<li>' + ICON('check','ico ico-sm') + '<span>' + esc(f) + '</span></li>'; }).join('')
      + '</ul>'
    : '';
  var negoHtml = d.negotiation
    ? '<div class="sw-section-t">Negotiation tip</div><div class="sw-nego">' + esc(d.negotiation) + '</div>'
    : '';

  document.getElementById('sw-body').innerHTML =
    '<div class="sw-res-head">'
    +   '<div><div class="sw-res-role">' + esc(d.role || '') + '</div>'
    +   '<div class="sw-res-loc">' + esc(d.location || 'Not specified') + (d.level ? ' · ' + esc(d.level) : '') + '</div></div>'
    +   '<span class="sw-conf ' + conf + '">' + conf + ' confidence</span>'
    + '</div>'
    + '<div class="sw-median">' + _money(mid, cur) + ' <small>/ year median</small></div>'
    + '<div class="sw-range-lbl">Typical range ' + _money(lo, cur) + ' - ' + _money(hi, cur) + '</div>'
    + '<div class="sw-bar">'
    +   '<span class="sw-tick lo">' + _money(lo, cur) + '</span>'
    +   '<span class="sw-tick hi">' + _money(hi, cur) + '</span>'
    +   '<span class="sw-dot" style="left:' + pct.toFixed(1) + '%" title="Median ' + _money(mid, cur) + '"></span>'
    + '</div>'
    + '<div class="sw-scale"><span>Low</span><span>Median</span><span>High</span></div>'
    + factorsHtml
    + negoHtml
    + '<div class="sw-disclaimer">'
    +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    +   '<span>' + esc(d.disclaimer || 'AI estimate, not live market data. Verify before deciding.') + '</span>'
    + '</div>';
}

async function lookup(){
  if (IS_ANON) { promptSignup('see salary insights for any role'); return; }
  var role = document.getElementById('sw-role').value.trim();
  var location = document.getElementById('sw-location').value.trim();
  if (!role) { toast('Enter a job title first', {type:'warn'}); document.getElementById('sw-role').focus(); return; }

  _loadingState();
  try {
    var r = await fetch(API + '/ai/salary', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
      body: JSON.stringify({ role, location, level, resume: _resume() })
    });
    if (r.status === 402) { _gate(); return; }
    if (!r.ok) { var e = await r.json().catch(function(){return {};}); throw new Error(e.error || 'AI failed'); }
    var d = await r.json();
    if (typeof d.median !== 'number') throw new Error('empty');
    _render(d);
    _track('salary_open');
  } catch(e){
    document.getElementById('sw-body').innerHTML =
      '<div class="sw-empty" style="color:var(--danger);"><h4 style="color:var(--danger);">Couldn\'t estimate that</h4><p>' + esc(e.message || 'Please try a more common job title and try again.') + '</p></div>';
  }
}

document.getElementById('sw-levels').addEventListener('click', function(e){
  var b = e.target.closest('.sw-level'); if (!b) return;
  level = b.getAttribute('data-level') || '';
  document.querySelectorAll('.sw-level').forEach(function(x){ x.classList.remove('active'); });
  b.classList.add('active');
});
document.getElementById('sw-go').addEventListener('click', lookup);
document.getElementById('sw-role').addEventListener('keydown', function(e){ if (e.key === 'Enter') lookup(); });
document.getElementById('sw-location').addEventListener('keydown', function(e){ if (e.key === 'Enter') lookup(); });

(async () => {
  await loadCurrentUser();
  document.getElementById('sw-title').innerHTML = ICON('gauge') + ' <span>Salary Insights</span>';
  document.getElementById('sw-go').innerHTML = ICON('sparkle') + ' <span>Show pay range</span>';
  const planPill = document.getElementById('plan-pill');
  if (isPaid()) planPill.innerHTML = `<button class="pill success" onclick="openBillingPortal()" style="cursor:pointer;">${ICON('crown','ico ico-sm')} ${planLabel()}</button>`;
  else planPill.innerHTML = `<a class="btn btn-primary btn-xs" href="pricing">${ICON('sparkle','ico ico-sm')} <span>Upgrade</span></a>`;
  // Prefill role from the resume's most recent title, if present.
  try {
    var rz = _resume();
    var top = (rz.experience || [])[0];
    if (top && top.title) document.getElementById('sw-role').value = top.title;
  } catch (e) {}
  _emptyState();
})();
</script>
  <script src="js/appnav.js"></script>
  <script src="js/acctcenter.js"></script>
<script src="/js/appshell.js"></script>
</body>
</html>
