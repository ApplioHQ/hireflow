<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="logo.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Applio">

<script src="js/theme.js"></script>
<style>
  .sw-wrap { max-width: 1280px; margin: 0 auto; padding: 28px 20px 80px; }
  .sw-head h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 800; letter-spacing: -.5px; display:flex; align-items:center; gap:10px; }
  .sw-head p { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .sw-grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; margin-top: 22px; align-items: start; }
  @media (max-width: 1024px) { .sw-grid { grid-template-columns: 1fr; } }
  .sw-form label { display:block; font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; }
  .sw-form label:first-of-type { margin-top: 0; }
  .sw-form input, .sw-form select { width:100%; box-sizing:border-box; padding: 10px 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text); font-size: 14px; font-family: inherit; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .sw-form input:focus, .sw-form select:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
  .sw-levels { display:flex; flex-wrap:wrap; gap: 8px; }
  .sw-level { font-size: 12.5px; padding: 7px 13px; border-radius: var(--r-full); border: 1px solid var(--border); background: var(--bg-2); color: var(--text); cursor: pointer; transition: all var(--dur) var(--ease); }
  .sw-level:hover { border-color: var(--accent); }
  .sw-level.active { border-color: transparent; color: #fff; background: var(--gradient); box-shadow: var(--sh-1); }
  .sw-go { width:100%; margin-top: 18px; }
  .sw-out-card { min-height: 520px; display:flex; flex-direction: column; }
  .sw-empty { flex:1; display:flex; flex-direction: column; align-items:center; justify-content: center; text-align:center; color: var(--muted); padding: 40px; }
  .sw-empty svg { width: 46px; height: 46px; color: var(--accent); margin-bottom: 14px; opacity:.9; }
  .sw-empty h4 { color: var(--text); font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .sw-empty p { font-size: 13.5px; max-width: 360px; line-height: 1.6; }
  .sw-steps { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; text-align: left; max-width: 340px; width: 100%; }
  .sw-step { display: flex; gap: 11px; align-items: flex-start; }
  .sw-step-n { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: rgba(109,77,252,.16); border: 1px solid rgba(109,77,252,.3); color: var(--accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .sw-step-t { font-size: 13px; font-weight: 650; color: var(--text); }
  .sw-step-d { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 2px; }

  /* Result */
  .sw-res-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  .sw-res-role { font-size: 17px; font-weight: 800; }
  .sw-res-loc { font-size: 13px; color: var(--muted); }
  .sw-conf { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing:.06em; padding: 3px 9px; border-radius: var(--r-full); }
  .sw-conf.high { color:#22c55e; background:rgba(34,197,94,.14); }
  .sw-conf.medium { color:#f59e0b; background:rgba(245,158,11,.14); }
  .sw-conf.low { color:#ef4444; background:rgba(239,68,68,.14); }
  .sw-res-meta { margin-top: 6px; }
  .sw-src { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding: 3px 9px; border-radius: var(--r-full); }
  .sw-src-live { color:#22c55e; background:rgba(34,197,94,.14); }
  .sw-src-est  { color:#8a73f8; background:rgba(139,92,246,.14); }
  .sw-median { font-size: 34px; font-weight: 800; letter-spacing:-.5px; margin: 18px 0 2px; }
  .sw-median small { font-size: 15px; font-weight: 600; color: var(--muted); }
  .sw-range-lbl { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }

  /* Enhanced range bar */
  .sw-range-bar { position: relative; height: 44px; margin: 24px 0 16px; }
  .sw-range-track { position: absolute; top: 50%; left: 0; right: 0; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #e5e7eb 0%, #e5e7eb 100%); transform: translateY(-50%); }
  .sw-range-track.light-mode { background: linear-gradient(90deg, #f3f4f6 0%, #f3f4f6 100%); }
  .sw-range-fill { position: absolute; top: 50%; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transform: translateY(-50%); transition: left .6s cubic-bezier(.2,.8,.2,1), width .6s cubic-bezier(.2,.8,.2,1); }
  .sw-percentile-markers { position: absolute; top: 0; left: 0; right: 0; height: 100%; pointer-events: none; }
  .sw-percentile-marker { position: absolute; top: 50%; width: 2px; height: 20px; background: var(--border); transform: translate(-50%, -50%); }
  .sw-percentile-marker.median { background: var(--accent); height: 28px; }
  .sw-percentile-marker::after { content: attr(data-label); position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .sw-percentile-marker.median::after { color: var(--accent); font-weight: 700; top: -26px; }
  .sw-range-tooltip { position: absolute; top: -36px; left: 50%; transform: translateX(-50%); background: var(--bg-1); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; box-shadow: var(--sh-1); }
  .sw-range-tooltip::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); border: 4px solid transparent; border-top-color: var(--border); }
  .sw-range-bar:hover .sw-range-tooltip { opacity: 1; }

  /* Percentile breakdown cards */
  .sw-percentile-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
  @media (max-width: 640px) { .sw-percentile-grid { grid-template-columns: repeat(3, 1fr); } }
  .sw-percentile-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 10px; text-align: center; transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .sw-percentile-card:hover { transform: translateY(-2px); box-shadow: var(--sh-1); }
  .sw-percentile-card.median { border-color: var(--accent); background: rgba(109,77,252,.06); }
  .sw-percentile-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .sw-percentile-value { font-size: 18px; font-weight: 800; color: var(--text); line-height: 1; }
  .sw-percentile-card.median .sw-percentile-value { color: var(--accent); }

  /* Section headers */
  .sw-section-t { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:24px 0 10px; }
  .sw-factors { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:9px; }
  .sw-factors li { display:flex; gap:9px; align-items:flex-start; font-size:13.5px; line-height:1.5; }
  .sw-factors li svg { flex-shrink:0; width:16px; height:16px; color:var(--accent); margin-top:2px; }

  /* Compensation breakdown */
  .sw-comp-breakdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
  @media (max-width: 640px) { .sw-comp-breakdown { grid-template-columns: 1fr; } }
  .sw-comp-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px; text-align: center; }
  .sw-comp-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .sw-comp-value { font-size: 22px; font-weight: 800; color: var(--text); line-height: 1; }
  .sw-comp-pct { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .sw-comp-card.base .sw-comp-value { color: var(--accent); }
  .sw-comp-card.bonus .sw-comp-value { color: #f59e0b; }
  .sw-comp-card.equity .sw-comp-value { color: #22c55e; }

  /* Offer fairness calculator */
  .sw-offer-calc { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px; margin: 16px 0; }
  .sw-offer-calc h4 { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .sw-offer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 480px) { .sw-offer-row { grid-template-columns: 1fr; } }
  .sw-offer-field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .sw-offer-field input { width: 100%; box-sizing: border-box; padding: 10px 12px; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text); font-size: 14px; font-family: inherit; }
  .sw-offer-field input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
  .sw-offer-result { padding-top: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .sw-offer-verdict { font-size: 14px; font-weight: 700; }
  .sw-offer-verdict.good { color: #22c55e; }
  .sw-offer-verdict.fair { color: #f59e0b; }
  .sw-offer-verdict.low { color: #ef4444; }
  .sw-offer-detail { font-size: 12px; color: var(--muted); }

  /* Location comparison */
  .sw-loc-compare { margin-top: 16px; }
  .sw-loc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .sw-loc-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; cursor: pointer; transition: all var(--dur) var(--ease); }
  .sw-loc-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--sh-1); }
  .sw-loc-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(109,77,252,.2); }
  .sw-loc-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .sw-loc-median { font-size: 18px; font-weight: 800; color: var(--accent); }
  .sw-loc-range { font-size: 11px; color: var(--muted); }

  /* Company size breakdown */
  .sw-size-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 640px) { .sw-size-grid { grid-template-columns: 1fr; } }
  .sw-size-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; }
  .sw-size-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .sw-size-median { font-size: 18px; font-weight: 800; color: var(--text); }
  .sw-size-range { font-size: 11px; color: var(--muted); }

  /* Remote differential */
  .sw-remote-diff { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: rgba(109,77,252,.08); border: 1px solid rgba(109,77,252,.2); border-radius: var(--r-md); margin: 12px 0; }
  .sw-remote-icon { width: 40px; height: 40px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sw-remote-text { flex: 1; }
  .sw-remote-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .sw-remote-value { font-size: 12px; color: var(--muted); }
  .sw-remote-value strong { color: var(--accent); }

  /* Market trend */
  .sw-trend { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-full); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .sw-trend.up { background: rgba(34,197,94,.14); color: #16a34a; border: 1px solid rgba(34,197,94,.3); }
  .sw-trend.down { background: rgba(239,68,68,.14); color: #dc2626; border: 1px solid rgba(239,68,68,.3); }
  .sw-trend.flat { background: rgba(245,158,11,.14); color: #b45309; border: 1px solid rgba(245,158,11,.3); }

  .sw-nego { background: var(--bg-2); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius: var(--r-sm); padding: 12px 14px; font-size:13.5px; line-height:1.55; }
  .sw-nego strong { color: var(--text); }
  .sw-disclaimer { margin-top: 20px; font-size: 11.5px; color: var(--muted); line-height:1.5; display:flex; gap:8px; align-items:flex-start; }
  .sw-disclaimer svg { flex-shrink:0; width:15px; height:15px; margin-top:1px; opacity:.8; }

  /* Skeleton loader */
  .sw-skel { display:flex; flex-direction:column; gap:14px; padding:4px 2px; }
  .sw-skel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:6px; }
  .sw-skel-head-l { flex:1; display:flex; flex-direction:column; gap:8px; }
  .sw-sk { display:block; background: linear-gradient(90deg, var(--bg-2) 0%, rgba(255,255,255,.06) 50%, var(--bg-2) 100%); background-size: 200% 100%; border-radius: 6px; animation: swShimmer 1.35s linear infinite; }
  .sw-sk-lg     { height: 42px; width: 62%; border-radius: 10px; }
  .sw-sk-title  { height: 18px; width: 55%; }
  .sw-sk-sub    { height: 12px; width: 38%; }
  .sw-sk-pill   { height: 22px; width: 130px; border-radius: 999px; }
  .sw-sk-bar    { height: 12px; width: 100%; border-radius: 999px; margin-top: 6px; }
  .sw-sk-legend { display:flex; gap: 40px; }
  .sw-sk-legend .sw-sk { height: 10px; width: 50px; }
  .sw-sk-section { height: 13px; width: 40%; margin-top: 10px; }
  .sw-sk-line    { height: 12px; }
  .sw-sk-line.w95 { width: 95%; } .sw-sk-line.w85 { width: 85%; }
  .sw-sk-line.w80 { width: 80%; } .sw-sk-line.w70 { width: 70%; }
  .sw-sk-line.w60 { width: 60%; }
  .sw-sk-block  { height: 62px; width: 100%; border-radius: 10px; margin-top: 6px; }
  @keyframes swShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .sw-sk { animation: none; background: var(--bg-2); } }

  .sw-gate { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 44px 30px; }
  .sw-gate .badge { font-size: 11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color: var(--accent); background: rgba(109,77,252,.14); border:1px solid rgba(109,77,252,.3); border-radius: var(--r-full); padding: 5px 12px; margin-bottom: 16px; }
  .sw-gate h4 { font-size: 19px; font-weight: 800; margin-bottom: 8px; }
  .sw-gate p { color: var(--muted); font-size: 14px; max-width: 380px; line-height:1.6; margin-bottom: 18px; }

  .sw-free { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
</style>

<body class="app-body-scroll">
<header class="app-topbar">
  <div class="brand"><img src="logo.jpeg" width="32" height="32" class="brand-logo" alt="Applio"><span>Applio</span></div>
  <div class="topbar-right">
    <span id="health-badge"></span>
    <span id="plan-pill"></span>
    <button class="theme-toggle" onclick="toggleTheme()">☀️ Light</button>
    <button class="btn btn-ghost btn-sm" onclick="signOut()">Sign out</button>
  </div>
</header>

<main class="sw-wrap">
  <div class="sw-head">
    <h1 id="sw-title"></h1>
    <p>See typical pay ranges for a role and location, so you can tell which opportunities are worth your time.</p>
    <p class="sw-free" id="sw-free" style="display:none; font-size:12.5px; color:var(--muted); margin-top:8px;"></p>
  </div>

  <div class="sw-grid">
    <!-- Form -->
    <div class="section-card sw-form">
      <label>Job title</label>
      <input id="sw-role" placeholder="e.g. Product Manager" autocomplete="off">

      <label>Location <span style="font-weight:400;color:var(--muted);">(optional)</span></label>
      <input id="sw-location" placeholder="e.g. Austin, TX or Remote (US)" autocomplete="off">

      <label>Seniority <span style="font-weight:400;color:var(--muted);">(optional)</span></label>
      <div class="sw-levels" id="sw-levels">
        <button type="button" class="sw-level active" data-level="">Auto</button>
        <button type="button" class="sw-level" data-level="Entry">Entry</button>
        <button type="button" class="sw-level" data-level="Mid">Mid</button>
        <button type="button" class="sw-level" data-level="Senior">Senior</button>
        <button type="button" class="sw-level" data-level="Lead / Staff">Lead</button>
      </div>

      <button class="btn btn-primary sw-go" id="sw-go"></button>
    </div>

    <!-- Output -->
    <div class="section-card sw-out-card" id="sw-out">
      <div id="sw-body"></div>
    </div>
  </div>
</main>

<script>
const API = window.HIREFLOW_CONFIG.API_URL;
const TOKEN = localStorage.getItem('hf_token');
function _track(name,meta){if(!TOKEN)return;fetch(window.HIREFLOW_CONFIG.API_URL+'/track',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify({name,meta})}).catch(()=>{});}
const IS_ANON = !TOKEN; if (IS_ANON) window.addEventListener('load', initAnonTopbar);
let level = '';

function esc(s){return String(s==null?'':s).replace(/[&<>\"']/g,c=>({\"&\":\"&\",\"<\":\"<\",\">\":\">\",'\"':\""\",\"'\":\"'\"}[c]));}
function signOut(){ localStorage.removeItem('hf_token'); location.href='/'; }
function _resume(){ try { return JSON.parse(localStorage.getItem('hf_resume') || '{}') || {}; } catch { return {}; } }

// Format an integer as currency (no decimals), best-effort by ISO code.
function _money(n, cur){
  n = Math.round(Number(n) || 0);
  try { return new Intl.NumberFormat(undefined, { style:'currency', currency:(cur||'USD'), maximumFractionDigits:0 }).format(n); }
  catch { return (cur||'USD') + ' ' + n.toLocaleString(); }
}

function _emptyState(){
  var steps = [
    ['Enter a role', 'Job title, plus a location if you have one in mind.'],
    ['Get a typical range', 'Low, median, and high base pay for that role.'],
    ['Decide with context', 'What moves pay, a negotiation tip, and how confident the estimate is.'],
  ];
  document.getElementById('sw-body').innerHTML =
    '<div class="sw-empty">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>'
    + '<h4>What\\'s this role worth?</h4>'
    + '<p>Enter a job title on the left to see a typical pay range and what drives it, so you know which opportunities deserve your time.</p>'
    + '<div class="sw-steps">'
    +   steps.map(function(s,i){ return '<div class="sw-step"><span class="sw-step-n">' + (i+1) + '</span><div><div class="sw-step-t">' + s[0] + '</div><div class="sw-step-d">' + s[1] + '</div></div></div>'; }).join('')
    + '</div>'
    + '</div>';
}

function _gate(){
  document.getElementById('sw-body').innerHTML =
    '<div class="sw-gate">'
    + '<span class="badge">Free look used</span>'
    + '<h4>Unlock unlimited salary insights</h4>'
    + '<p>Pay-range insights on any role are free and unlimited.</p>'
    + '<a class="btn btn-primary" href="pricing">' + ICON('sparkle','ico ico-sm') + ' See plans</a>'
    + '</div>';
}

function _loadingState(){
  document.getElementById('sw-body').innerHTML =
    '<div class="sw-skel" aria-hidden="true" role="status" aria-label="Loading salary insights">'
    +   '<div class="sw-skel-head">'
    +     '<div class="sw-skel-head-l">'
    +       '<span class="sw-sk sw-sk-title"></span>'
    +       '<span class="sw-sk sw-sk-sub"></span>'
    +       '<span class="sw-sk sw-sk-pill"></span>'
    +     '</div>'
    +     '<span class="sw-sk sw-sk-pill" style="width:120px;"></span>'
    +   '</div>'
    +   '<span class="sw-sk sw-sk-lg"></span>'
    +   '<span class="sw-sk sw-sk-sub" style="width:46%;"></span>'
    +   '<span class="sw-sk sw-sk-bar"></span>'
    +   '<div class="sw-sk-legend">'
    +     '<span class="sw-sk"></span><span class="sw-sk"></span><span class="sw-sk"></span>'
    +   '</div>'
    +   '<span class="sw-sk sw-sk-section"></span>'
    +   '<span class="sw-sk sw-sk-line w95"></span>'
    +   '<span class="sw-sk sw-sk-line w85"></span>'
    +   '<span class="sw-sk sw-sk-line w70"></span>'
    +   '<span class="sw-sk sw-sk-section"></span>'
    +   '<span class="sw-sk sw-sk-block"></span>'
    + '</div>';
}

function _render(d){
  var cur = d.currency || 'USD';
  var lo = Number(d.low)||0, mid = Number(d.median)||0, hi = Number(d.high)||0;
  var pct = (hi > lo) ? Math.max(4, Math.min(96, ((mid - lo) / (hi - lo)) * 100)) : 50;
  var conf = (['low','medium','high'].indexOf(d.confidence) >= 0) ? d.confidence : 'medium';

  var factors = Array.isArray(d.factors) ? d.factors : [];
  var factorsHtml = factors.length
    ? '<div class="sw-section-t">What moves the pay</div><ul class="sw-factors">'
      + factors.map(function(f){ return '<li>' + ICON('check','ico ico-sm') + '<span>' + esc(f) + '</span></li>'; }).join('')
      + '</ul>'
    : '';

  var negoHtml = d.negotiation
    ? '<div class="sw-section-t">Negotiation tip</div><div class="sw-nego">' + esc(d.negotiation) + '</div>'
    : '';

  var srcPill = (d.source === 'adzuna')
    ? '<span class="sw-src sw-src-live" title="Based on real job listings">● Live market data · '
        + (Number(d.sampleSize)||0).toLocaleString() + ' listings</span>'
    : '<span class="sw-src sw-src-est" title="AI estimate, not live data">● AI estimate</span>';

  // Compensation breakdown (estimate if not provided)
  var base = d.base || mid;
  var bonus = d.bonus || Math.round(mid * 0.1);
  var equity = d.equity || Math.round(mid * 0.05);
  var totalComp = base + bonus + equity;
  var compBreakdown = d.source === 'adzuna' ? '' : (
    '<div class="sw-section-t">Total compensation estimate</div>'
    + '<div class="sw-comp-breakdown">'
    +   '<div class="sw-comp-card base"><div class="sw-comp-label">Base salary</div><div class="sw-comp-value">' + _money(base, cur) + '</div><div class="sw-comp-pct">~' + Math.round(base/totalComp*100) + '%</div></div>'
    +   '<div class="sw-comp-card bonus"><div class="sw-comp-label">Annual bonus</div><div class="sw-comp-value">' + _money(bonus, cur) + '</div><div class="sw-comp-pct">~' + Math.round(bonus/totalComp*100) + '%</div></div>'
    +   '<div class="sw-comp-card equity"><div class="sw-comp-label">Equity (annualized)</div><div class="sw-comp-value">' + _money(equity, cur) + '</div><div class="sw-comp-pct">~' + Math.round(equity/totalComp*100) + '%</div></div>'
    + '</div>'
    + '<div style="text-align:right; margin-top:8px; font-size:14px; font-weight:700; color:var(--text);">Total: ' + _money(totalComp, cur) + '/yr</div>'
  );

  // Offer fairness calculator
  var offerCalc = '<div class="sw-offer-calc">'
    + '<h4>' + ICON('calculator','ico ico-sm') + ' Is your offer fair?</h4>'
    + '<div class="sw-offer-row">'
    +   '<div class="sw-offer-field"><label>Your base offer</label><input type="number" id="offer-base" placeholder="e.g. 120000" step="1000" min="0"></div>'
    +   '<div class="sw-offer-field"><label>Bonus + equity (optional)</label><input type="number" id="offer-extra" placeholder="e.g. 30000" step="1000" min="0"></div>'
    + '</div>'
    + '<button class="btn btn-secondary btn-sm" onclick="_checkOffer(' + mid + ',' + lo + ',' + hi + ',\'' + cur + '\')">' + ICON('check','ico ico-sm') + ' Check my offer</button>'
    + '<div id="offer-result" class="sw-offer-result" style="display:none;"></div>'
    + '</div>';

  // Percentile breakdown
  var p10 = Math.round(lo * 0.8);
  var p25 = lo;
  var p50 = mid;
  var p75 = hi;
  var p90 = Math.round(hi * 1.15);
  var percHtml = '<div class="sw-section-t">Percentile breakdown</div>'
    + '<div class="sw-percentile-grid">'
    +   '<div class="sw-percentile-card"><div class="sw-percentile-label">10th</div><div class="sw-percentile-value">' + _money(p10, cur) + '</div></div>'
    +   '<div class="sw-percentile-card"><div class="sw-percentile-label">25th</div><div class="sw-percentile-value">' + _money(p25, cur) + '</div></div>'
    +   '<div class="sw-percentile-card median"><div class="sw-percentile-label">50th (median)</div><div class="sw-percentile-value">' + _money(p50, cur) + '</div></div>'
    +   '<div class="sw-percentile-card"><div class="sw-percentile-label">75th</div><div class="sw-percentile-value">' + _money(p75, cur) + '</div></div>'
    +   '<div class="sw-percentile-card"><div class="sw-percentile-label">90th</div><div class="sw-percentile-value">' + _money(p90, cur) + '</div></div>'
    + '</div>';

  // Experience level breakdown (if available)
  var levelHtml = '';
  if (d.levels && Object.keys(d.levels).length) {
    levelHtml = '<div class="sw-section-t">By experience level</div>'
      + '<div class="sw-size-grid">';
    for (var lvl in d.levels) {
      var ld = d.levels[lvl];
      levelHtml += '<div class="sw-size-card">'
        + '<div class="sw-size-label">' + esc(lvl) + '</div>'
        + '<div class="sw-size-median">' + _money(ld.median || 0, cur) + '</div>'
        + '<div class="sw-size-range">' + _money(ld.low || 0, cur) + ' - ' + _money(ld.high || 0, cur) + '</div>'
        + '</div>';
    }
    levelHtml += '</div>';
  }

  // Location comparison (if multiple locations returned)
  var locHtml = '';
  if (d.locations && d.locations.length > 1) {
    locHtml = '<div class="sw-section-t">Compare locations</div>'
      + '<div class="sw-loc-grid">';
    d.locations.forEach(function(loc) {
      locHtml += '<div class="sw-loc-card" onclick="_selectLoc(this, \'' + esc(loc.name) + '\', ' + (loc.median||0) + ', \'' + esc(cur) + '\')">'
        + '<div class="sw-loc-name">' + esc(loc.name) + '</div>'
        + '<div class="sw-loc-median">' + _money(loc.median || 0, cur) + '</div>'
        + '<div class="sw-loc-range">' + _money(loc.low || 0, cur) + ' - ' + _money(loc.high || 0, cur) + '</div>'
        + '</div>';
    });
    locHtml += '</div>';
  }

  // Remote vs on-site differential
  var remoteHtml = '';
  if (d.remotePct !== undefined) {
    var diff = d.remotePct > 0 ? '+' : '';
    remoteHtml = '<div class="sw-section-t">Remote vs on-site</div>'
      + '<div class="sw-remote-diff">'
      +   '<div class="sw-remote-icon">' + ICON('monitor','ico ico-sm') + '</div>'
      +   '<div class="sw-remote-text">'
      +     '<div class="sw-remote-title">Remote pay differential</div>'
      +     '<div class="sw-remote-value">Remote roles pay <strong>' + diff + d.remotePct + '%</strong> ' + (d.remotePct > 0 ? 'more' : 'less') + ' than on-site for this role</div>'
      +   '</div>'
      + '</div>';
  }

  // Market trend
  var trendHtml = '';
  if (d.trend) {
    var trendClass = d.trend === 'up' ? 'up' : (d.trend === 'down' ? 'down' : 'flat');
    var trendIcon = d.trend === 'up' ? 'trending-up' : (d.trend === 'down' ? 'trending-down' : 'minus');
    trendHtml = '<div class="sw-section-t">Market trend</div>'
      + '<div class="sw-trend ' + trendClass + '">' + ICON(trendIcon,'ico ico-sm') + ' Pay trending ' + d.trend + ' ' + (d.trendPct ? '(' + d.trendPct + '%)' : '') + ' YoY</div>';
  }

  document.getElementById('sw-body').innerHTML =
    '<div class="sw-res-head">'
    +   '<div><div class="sw-res-role">' + esc(d.role || '') + '</div>'
    +   '<div class="sw-res-loc">' + esc(d.location || 'Not specified') + (d.level ? ' · ' + esc(d.level) : '') + '</div>'
    +   '<div class="sw-res-meta">' + srcPill + '</div></div>'
    +   '<span class="sw-conf ' + conf + '">' + conf + ' confidence</span>'
    + '</div>'
    + '<div class="sw-median">' + _money(mid, cur) + ' <small>/ year median</small></div>'
    + '<div class="sw-range-lbl">Typical range ' + _money(lo, cur) + ' - ' + _money(hi, cur) + '</div>'
    + '<div class="sw-range-bar">'
    +   '<div class="sw-range-track"></div>'
    +   '<div class="sw-range-fill" style="left:' + (100-pct).toFixed(1) + '%; width:' + pct.toFixed(1) + '%;"></div>'
    +   '<div class="sw-percentile-markers">'
    +     '<div class="sw-percentile-marker" data-label="Low" style="left:0%"></div>'
    +     '<div class="sw-percentile-marker" data-label="25th" style="left:' + ((p25-lo)/(hi-lo)*100).toFixed(1) + '%"></div>'
    +     '<div class="sw-percentile-marker median" data-label="Median" style="left:' + pct.toFixed(1) + '%"></div>'
    +     '<div class="sw-percentile-marker" data-label="75th" style="left:' + ((p75-lo)/(hi-lo)*100).toFixed(1) + '%"></div>'
    +     '<div class="sw-percentile-marker" data-label="High" style="left:100%"></div>'
    +   '</div>'
    +   '<div class="sw-range-tooltip" id="range-tooltip"></div>'
    + '</div>'
    + '<div class="sw-scale"><span>Low</span><span>25th</span><span>Median</span><span>75th</span><span>High</span></div>'
    + percHtml
    + compBreakdown
    + offerCalc
    + levelHtml
    + locHtml
    + remoteHtml
    + trendHtml
    + factorsHtml
    + negoHtml
    + '<div class="sw-disclaimer">'
    +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    +   '<span>' + esc(d.disclaimer || 'AI estimate, not live market data. Verify before deciding.') + '</span>'
    + '</div>';

  // Tooltip for range bar
  var bar = document.querySelector('.sw-range-bar');
  var tooltip = document.getElementById('range-tooltip');
  if (bar && tooltip) {
    bar.addEventListener('mousemove', function(e) {
      var rect = bar.getBoundingClientRect();
      var rel = (e.clientX - rect.left) / rect.width;
      rel = Math.max(0, Math.min(1, rel));
      var val = Math.round(lo + rel * (hi - lo));
      tooltip.textContent = _money(val, cur);
      tooltip.style.left = (rel * 100).toFixed(1) + '%';
    });
    bar.addEventListener('mouseleave', function() { tooltip.style.opacity = '0'; });
  }
}

async function lookup(){
  if (IS_ANON) { promptSignup('see salary insights for any role'); return; }
  var role = document.getElementById('sw-role').value.trim();
  var location = document.getElementById('sw-location').value.trim();
  if (!role) { toast('Enter a job title first', {type:'warn'}); document.getElementById('sw-role').focus(); return; }

  _loadingState();
  try {
    var r = await fetch(API + '/ai/salary', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
      body: JSON.stringify({ role, location, level, resume: _resume() })
    });
    if (r.status === 402) { _gate(); return; }
    if (!r.ok) { var e = await r.json().catch(function(){return {};}); throw new Error(e.error || 'AI failed'); }
    var d = await r.json();
    if (typeof d.median !== 'number') throw new Error('empty');
    _render(d);
    _track('salary_open');
  } catch(e){
    document.getElementById('sw-body').innerHTML =
      '<div class="sw-empty" style="color:var(--danger);"><h4 style="color:var(--danger);">Couldn\\'t estimate that</h4><p>' + esc(e.message || 'Please try a more common job title and try again.') + '</p></div>';
  }
}

function _checkOffer(median, low, high, cur) {
  var base = parseInt(document.getElementById('offer-base').value || '0', 10);
  var extra = parseInt(document.getElementById('offer-extra').value || '0', 10);
  if (!base) { toast('Enter your base offer', {type:'warn'}); return; }
  var total = base + extra;
  var pct = ((total - median) / median * 100).toFixed(1);
  var verdict, cls;
  if (total >= high * 0.95) { verdict = 'Strong offer — above 75th percentile'; cls = 'good'; }
  else if (total >= median) { verdict = 'Fair offer — at or above median'; cls = 'good'; }
  else if (total >= low) { verdict = 'Below median — room to negotiate'; cls = 'fair'; }
  else { verdict = 'Low offer — significantly below market'; cls = 'low'; }
  var res = document.getElementById('offer-result');
  res.style.display = 'flex';
  res.innerHTML = '<span class="sw-offer-verdict ' + cls + '">' + verdict + '</span>'
    + '<span class="sw-offer-detail">Your total: ' + _money(total, cur) + ' vs median ' + _money(median, cur) + ' (' + (pct >= 0 ? '+' : '') + pct + '%)</span>';
}

function _selectLoc(card, name, median, cur) {
  document.querySelectorAll('.sw-loc-card').forEach(function(c){ c.classList.remove('selected'); });
  card.classList.add('selected');
  // Could trigger a re-fetch for that location
  toast('Selected ' + name + ' — median ' + _money(median, cur), {type:'info'});
}

document.getElementById('sw-levels').addEventListener('click', function(e){
  var b = e.target.closest('.sw-level'); if (!b) return;
  level = b.getAttribute('data-level') || '';
  document.querySelectorAll('.sw-level').forEach(function(x){ x.classList.remove('active'); });
  b.classList.add('active');
});
document.getElementById('sw-go').addEventListener('click', lookup);
document.getElementById('sw-role').addEventListener('keydown', function(e){ if (e.key === 'Enter') lookup(); });
document.getElementById('sw-location').addEventListener('keydown', function(e){ if (e.key === 'Enter') lookup(); });

(async () => {
  // Show empty state immediately, don't wait for user load
  _emptyState();

  try {
    await loadCurrentUser();
    document.getElementById('sw-title').innerHTML = ICON('gauge') + ' <span>Salary Insights</span>';
    document.getElementById('sw-go').innerHTML = ICON('sparkle') + ' <span>Show pay range</span>';
    const planPill = document.getElementById('plan-pill');
    if (isPaid()) planPill.innerHTML = `<button class="pill success" onclick="openBillingPortal()" style="cursor:pointer;">${ICON('crown','ico ico-sm')} ${planLabel()}</button>`;
    else planPill.innerHTML = `<a class="btn btn-primary btn-xs" href="pricing">${ICON('sparkle','ico ico-sm')} <span>Upgrade</span></a>`;
    // Prefill role from the resume's most recent title, if present.
    try {
      var rz = _resume();
      var top = (rz.experience || [])[0];
      if (top && top.title) document.getElementById('sw-role').value = top.title;
    } catch (e) {}
  } catch (e) {
    console.warn('Salary page: user load failed', e);
    // Still show the title/button even if user load fails
    document.getElementById('sw-title').innerHTML = ICON('gauge') + ' <span>Salary Insights</span>';
    document.getElementById('sw-go').innerHTML = ICON('sparkle') + ' <span>Show pay range</span>';
  }
})();
</script>
